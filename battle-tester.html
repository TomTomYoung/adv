<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前中後衛 バトルテスター</title><link rel="stylesheet" href="src/view/style.css"><link rel="stylesheet" href="src/view/battle-tester.css"></head>
<body class="battle-tester" data-lab-mode="both"><header><a href="index.html">冒険へ</a><h1>バトルテスター</h1><p>編成を決めて開始し、射程と巻き込み、各命中、ターン開始時の前進を確認します。</p><nav class="lab-controls" aria-label="テスターの表示"><button data-lab-mode="both" aria-pressed="true">両方表示</button><button data-lab-mode="play" aria-pressed="false">実エンジンで試遊</button><button data-lab-mode="detail" aria-pressed="false">詳細検証</button></nav></header>
<main><section class="lab-panel"><h2>1. 編成と開始</h2><div class="lab-controls"><label>プリセット<select id="preset"><option value="ranks">射程と3段</option><option value="rear_only">後衛のみ1人</option><option value="no_front">前衛0人</option><option value="front_rear">前衛＋後衛</option><option value="crowd">同段5体</option><option value="widths">異なる画像幅</option><option value="cross">4方向と斜め</option><option value="interrupt">被弾反応で中断</option></select></label><button id="apply-preset">プリセットを設定</button><label>方式<select id="mode"><option value="frontline">Frontline（前中後衛）</option><option value="grid">Grid</option><option value="classic">Classic</option></select></label><label>シード<input id="seed" type="number" value="20261014"></label><label>先制<select id="preemptive"><option value="">なし</option><option value="allies">味方2回</option><option value="enemies">敵2回</option></select></label></div>
<details><summary>味方・敵の人数、段、左右順、能力と状態</summary><h3>味方</h3><div id="allies" class="lab-roster"></div><button id="add-ally">味方を追加</button><h3>敵</h3><div id="enemies" class="lab-roster"></div><button id="add-enemy">敵を追加</button></details><div class="lab-controls"><button id="start" class="primary">この編成で開始 / Reset</button><button id="export">ケースJSONを出力</button><label>JSON読込<input id="import" type="file" accept="application/json"></label></div><p id="status" role="status"></p></section>
<section id="engine-panel" class="lab-panel lab-engine-panel" aria-labelledby="engine-heading">
<div class="lab-engine-toolbar"><h2 id="engine-heading">実エンジンで試遊</h2><p>上の編成と下の攻撃設定を読み込み、本編と同じ画面で戦闘します。敵は自動で行動します。</p>
<div class="lab-controls"><button id="engine-load" class="primary">設定を実エンジンへロード / Reset</button><label>本編の画面<select id="engine-layout"><option value="scene">背景内表示</option><option value="normal">従来表示</option></select></label></div><p id="engine-status" role="status">試遊画面を準備中…</p></div>
<iframe id="engine-frame" title="バトル実エンジン試遊" src="battle-engine-playtest.html"></iframe></section>
<section class="lab-panel lab-detail"><div class="lab-heading"><h2>2. 戦闘と攻撃設定</h2><span id="round"></span></div><div class="lab-controls"><label>表示幅<input id="width" type="number" min="280" max="1400" value="1000"></label><label>本体の重なり率<input id="overlap" type="number" min="0" max="0.5" step="0.01" value="0.33"></label><label>前衛倍率<input id="scale0" type="number" min="0.1" max="1.5" step="0.05" value="1"></label><label>中衛倍率<input id="scale1" type="number" min="0.1" max="1.5" step="0.05" value="0.85"></label><label>後衛倍率<input id="scale2" type="number" min="0.1" max="1.5" step="0.05" value="0.7"></label><label><input id="diagnostics" type="checkbox">仮想グリッドを表示</label></div>
<div id="battle-display" class="lab-stage"></div><div id="counts"></div><div id="participants" class="lab-participants"></div>
<div class="lab-controls"><label>攻撃者<select id="attacker"></select></label><label>標的<select id="target"></select></label><label>技能<select id="skill"><option value="lab_strike">設定攻撃</option><option value="attack">通常攻撃（武器設定）</option><option value="guard">防御</option></select></label><label>最小レンジ<input id="min-range" type="number" min="0" max="5" value="1"></label><label>最大レンジ<input id="range" type="number" min="1" max="5" value="5"></label><label>範囲<select id="shape"><option value="single">単体</option><option value="cross4">対象＋上下左右</option><option value="around8">対象＋周囲8</option><option value="row">横1段</option><option value="column">縦1列</option><option value="side_all">陣営全体</option></select></label><label>解決<select id="resolution"><option value="simultaneous">同時</option><option value="sequential">逐次</option></select></label><label>順序<select id="order"><option value="front_to_back">前衛→後衛・左→右</option><option value="back_to_front">後衛→前衛・左→右</option><option value="left_to_right">左→右・前衛→後衛</option><option value="right_to_left">右→左・前衛→後衛</option></select></label><label>配分<select id="series"><option value="constant">一定</option><option value="decrease">減衰</option><option value="increase">増加</option></select></label><label>基準<select id="basis"><option value="power">計算前の威力</option><option value="final">最初の最終ダメージ</option></select></label><label>増減係数<input id="series-step" type="number" min="0" max="10" step="0.1" value="0.25"></label><label>再評価<select id="reevaluate"><option value="alive">生存</option><option value="position">生存＋開始位置</option></select></label><label><input id="friendly" type="checkbox">味方巻き込み</label></div>
<p id="preview" aria-live="polite"></p><div class="lab-controls"><button id="execute" class="primary">攻撃を実行</button><button id="step">現在の個体を1手番進める</button><button id="round-step">次のターン開始まで進める</button><label>移動先<select id="move-depth"><option value="0">前衛</option><option value="1">中衛</option><option value="2">後衛</option></select></label><button id="move">行動者を移動</button><button id="save">戦闘を保存</button><button id="load">保存から再開</button></div></section>
<section class="lab-panel lab-detail"><h2>3. Coreのイベントを追跡</h2><p>各命中・反応・一歩前進を時系列で表示します。再生中も戦闘結果は確定済みです。</p><div class="lab-controls"><button id="event-prev">前のイベント</button><button id="event-next">次のイベント</button><button id="event-latest">現在の状態へ</button><span id="event-position"></span></div><ol id="event-log"></ol><details><summary>シード・行動キュー・座標・選択イベント</summary><pre id="debug"></pre></details></section></main><script type="module" src="src/battle-tester.js"></script></body></html>
