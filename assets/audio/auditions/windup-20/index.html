<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>攻撃開始音20種の試聴 — 灯帰りの迷宮</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui,sans-serif; color:#f6f3eb; background:#151b20; }
    * { box-sizing:border-box; }
    body { max-width:58rem; margin:0 auto; padding:1rem clamp(.8rem,3vw,2rem) 3rem; }
    header { margin:1rem 0; }
    a { color:#e9ca91; text-underline-offset:.2em; }
    h1 { margin:.45rem 0; font-size:clamp(1.65rem,4.5vw,2.6rem); }
    p { margin:.4rem 0; }
    nav,.transport { display:flex; gap:.55rem 1rem; align-items:center; flex-wrap:wrap; }
    .transport { margin:1.35rem 0 .7rem; padding:.65rem; background:#232b31; border:1px solid #424e55; border-radius:.5rem; }
    .transport label { display:inline-flex; align-items:center; gap:.4rem; }
    .transport input { width:6rem; }
    #status { font-size:.88rem; }
    button { font:inherit; border:1px solid #566169; border-radius:.4rem; background:#222a2f; color:inherit; padding:.45rem .75rem; cursor:pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:3px solid #f6ebd4; outline-offset:2px; }
    .clips { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.55rem; }
    .clip { display:grid; gap:.12rem; padding:.7rem .8rem; text-align:left; --accent:#e8bb72; }
    .clip:nth-child(even) { --accent:#df99ab; }
    .clip:hover,.clip[aria-pressed=true] { border-color:var(--accent); background:#30383c; }
    .code { color:var(--accent); font-size:.82rem; letter-spacing:.04em; }
    .code::after { content:' ▷'; }
    [aria-pressed=true] .code::after { content:' ▶'; }
    .description { color:#c9cfcd; font-size:.85rem; }
    @media(max-width:450px) { .clip {padding:.55rem;} .description {font-size:.76rem;} }
  </style>
</head>
<body>
<header>
  <a href="../../../../sound-library.html">SE・音源管理へ</a>
  <h1>攻撃開始音の試聴</h1>
  <p>味方と敵を10種類ずつ収録しました。各ボタンで開始音だけを再生します。</p>
  <nav><a href="adv-windup-20.mp4">20種を順に聞く（30秒）</a><a href="adv-windup-20-wav.zip" download>個別WAV一式</a></nav>
</header>
<main>
  <div class="transport">
    <button type="button" id="stop">停止</button>
    <label>試聴音量 <input id="level" type="range" min="0" max="100" value="65"></label>
    <output id="status" aria-live="polite">試聴待機</output>
  </div>
  <div class="clips">
    <button type="button" class="clip" data-file="A01.wav" aria-label="味方 A01 重装の踏み込み" aria-pressed="false">
      <span class="code">味方 A01</span><strong>重装の踏み込み</strong><span class="description">低い二歩から刃が立ち上がる</span>
    </button>
    <button type="button" class="clip" data-file="E01.wav" aria-label="敵 E01 獣の喉鳴り" aria-pressed="false">
      <span class="code">敵 E01</span><strong>獣の喉鳴り</strong><span class="description">閉じた喉が震え、牙の奥で息が荒れる</span>
    </button>
    <button type="button" class="clip" data-file="A02.wav" aria-label="味方 A02 大剣の抜き放ち" aria-pressed="false">
      <span class="code">味方 A02</span><strong>大剣の抜き放ち</strong><span class="description">鞘の擦れが金属の高鳴りへ抜ける</span>
    </button>
    <button type="button" class="clip" data-file="E02.wav" aria-label="敵 E02 巨兵の荷重" aria-pressed="false">
      <span class="code">敵 E02</span><strong>巨兵の荷重</strong><span class="description">足を据えた後、重い関節が持ち上がる</span>
    </button>
    <button type="button" class="clip" data-file="A03.wav" aria-label="味方 A03 戦列の号令" aria-pressed="false">
      <span class="code">味方 A03</span><strong>戦列の号令</strong><span class="description">太い角笛を二声、短く言い切る</span>
    </button>
    <button type="button" class="clip" data-file="E03.wav" aria-label="敵 E03 錆刃の歯噛み" aria-pressed="false">
      <span class="code">敵 E03</span><strong>錆刃の歯噛み</strong><span class="description">左右の歯が不揃いに噛み合う</span>
    </button>
    <button type="button" class="clip" data-file="A04.wav" aria-label="味方 A04 強弓の引き絞り" aria-pressed="false">
      <span class="code">味方 A04</span><strong>強弓の引き絞り</strong><span class="description">弦をきつく張り、張り詰めた所で止める</span>
    </button>
    <button type="button" class="clip" data-file="E04.wav" aria-label="敵 E04 大蛇の吸気" aria-pressed="false">
      <span class="code">敵 E04</span><strong>大蛇の吸気</strong><span class="description">鱗の擦れる音から太い吸気へ膨らむ</span>
    </button>
    <button type="button" class="clip" data-file="A05.wav" aria-label="味方 A05 騎槍の突進" aria-pressed="false">
      <span class="code">味方 A05</span><strong>騎槍の突進</strong><span class="description">詰まっていく蹄の間に風が走る</span>
    </button>
    <button type="button" class="clip" data-file="E05.wav" aria-label="敵 E05 甲虫の翅震い" aria-pressed="false">
      <span class="code">敵 E05</span><strong>甲虫の翅震い</strong><span class="description">左右の翅がずれた速さで回り出す</span>
    </button>
    <button type="button" class="clip" data-file="A06.wav" aria-label="味方 A06 鎖刃の巻き上げ" aria-pressed="false">
      <span class="code">味方 A06</span><strong>鎖刃の巻き上げ</strong><span class="description">鎖の輪が加速して一本に張る</span>
    </button>
    <button type="button" class="clip" data-file="E06.wav" aria-label="敵 E06 石像の軋み" aria-pressed="false">
      <span class="code">敵 E06</span><strong>石像の軋み</strong><span class="description">岩の粒が擦れながら巨体が起き上がる</span>
    </button>
    <button type="button" class="clip" data-file="A07.wav" aria-label="味方 A07 戦斧の振りかぶり" aria-pressed="false">
      <span class="code">味方 A07</span><strong>戦斧の振りかぶり</strong><span class="description">太い風の帯が頭上を回る</span>
    </button>
    <button type="button" class="clip" data-file="E07.wav" aria-label="敵 E07 魔将の宣告" aria-pressed="false">
      <span class="code">敵 E07</span><strong>魔将の宣告</strong><span class="description">低い警告を三つ、最後だけ長く刻む</span>
    </button>
    <button type="button" class="clip" data-file="A08.wav" aria-label="味方 A08 雷槍の帯電" aria-pressed="false">
      <span class="code">味方 A08</span><strong>雷槍の帯電</strong><span class="description">細かい放電が一つの唸りに集まる</span>
    </button>
    <button type="button" class="clip" data-file="E08.wav" aria-label="敵 E08 深淵の逆鳴り" aria-pressed="false">
      <span class="code">敵 E08</span><strong>深淵の逆鳴り</strong><span class="description">逆向きに迫る共鳴が吸い込まれて止まる</span>
    </button>
    <button type="button" class="clip" data-file="A09.wav" aria-label="味方 A09 魔剣の共鳴" aria-pressed="false">
      <span class="code">味方 A09</span><strong>魔剣の共鳴</strong><span class="description">低いユニゾンから五度が開く</span>
    </button>
    <button type="button" class="clip" data-file="E09.wav" aria-label="敵 E09 雷獣の逆毛" aria-pressed="false">
      <span class="code">敵 E09</span><strong>雷獣の逆毛</strong><span class="description">不規則な放電の隙間から唸りがせり上がる</span>
    </button>
    <button type="button" class="clip" data-file="A10.wav" aria-label="味方 A10 全力の構え" aria-pressed="false">
      <span class="code">味方 A10</span><strong>全力の構え</strong><span class="description">一度溜め、間を切って一気に迫る</span>
    </button>
    <button type="button" class="clip" data-file="E10.wav" aria-label="敵 E10 竜の咆哮" aria-pressed="false">
      <span class="code">敵 E10</span><strong>竜の咆哮</strong><span class="description">低い息継ぎから喉が開き、咆哮が立つ</span>
    </button>
  </div>
  <audio id="player" preload="none"></audio>
</main>
<script>
  const player=document.querySelector('#player');
  const status=document.querySelector('#status');
  const level=document.querySelector('#level');
  let active=null;
  function finish(message) {
    if (active) active.setAttribute('aria-pressed','false');
    active=null;
    status.textContent=message;
  }
  function stop() {
    player.pause();
    finish('試聴待機');
  }
  function updateVolume() { player.volume=Number(level.value)/100; }
  function play(button) {
    stop();
    active=button;
    button.setAttribute('aria-pressed','true');
    status.textContent=button.getAttribute('aria-label');
    player.src=button.dataset.file;
    player.play().catch(error=>{
      if (active===button && error.name!=='AbortError') finish('音源を再生できませんでした。');
    });
  }
  document.querySelector('.clips').addEventListener('click',event=>{
    const button=event.target.closest('button[data-file]');
    if (button) play(button);
  });
  document.querySelector('#stop').addEventListener('click',stop);
  level.addEventListener('input',updateVolume);
  player.addEventListener('ended',()=>{if (player.ended) finish('試聴終了');});
  window.addEventListener('pagehide',stop);
  document.addEventListener('visibilitychange',()=>{if (document.hidden) stop();});
  updateVolume();
</script>
</body></html>
