<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>くぼみの表示確認 — 灯帰りの迷宮</title>
<style>
body{margin:0;background:#101a20;color:#e0e7e4;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px}a{color:#e8c783}button,select,input{font:inherit}button,select{background:#25353b;color:inherit;border:1px solid #708080;border-radius:5px;padding:8px;cursor:pointer}button[aria-pressed=true]{border-color:#e8c783;background:#46534d}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}.controls label{display:flex;align-items:center;gap:8px}canvas{display:block;width:100%;aspect-ratio:2;image-rendering:pixelated;background:#080e12}#description{min-height:3em}#status{color:#e8c783}@media(max-width:650px){main{padding:12px}.types{grid-template-columns:1fr 1fr}.types button{font-size:14px}}
</style></head>
<body><main><h1>くぼみの表示確認</h1><p>種類・配置・見る方向を切り替えて、底・側面・水面のつながりを確認できます。</p>
<div class="types" id="types" aria-label="くぼみの種類"></div>
<div class="controls"><label>配置<select id="shape"><option value="single">1セル</option><option value="pair">2セル連続</option><option value="square" selected>2×2セル</option><option value="elbow">L字</option><option value="mixed">浅い・深い・底の見えない床を連結</option></select></label>
<label>見る方向<select id="facing"><option value="north">北向き</option><option value="east">東向き</option><option value="south">南向き</option><option value="west">西向き</option></select></label>
<label>明るさ<input id="light" type="range" min="0" max="8" value="8"></label></div>
<canvas id="preview" aria-label="くぼみのダンジョン表示"></canvas><p id="description"></p><p id="status" role="status">読み込み中</p>
<p><a href="config/map.html">マップ編集を開く</a> ／ <a href="view-preview.html">画面全体の表示確認</a></p></main><script type="module" src="src/depression-preview.js"></script></body></html>
