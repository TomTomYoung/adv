<text x="60" y="609" font-size="17">青丸 A–F：右欄のクエストイベント（同じ座標は同じ文字）</text>
<text x="60" y="641" font-size="17">濃色：壁 # ／ 淡色：通行セル . ／ 黄点：共通火台</text>
<text x="60" y="673" font-size="17">i：巡回記録 (3, 1) ／ ↓：B2への階段 (13, 7)</text>
<text x="60" y="715" font-size="21">往路：A → B → D → F ／ 帰路：F → D → B → A</text>
<text x="60" y="747" font-size="17">C・E の壁松明は任意に調べられる。B2はq001の経路外。</text>
<text x="60" y="789" font-size="21">Aから町へ：篝火広場 → 灯番組合 → 灯番詰所</text>
<text x="60" y="821" font-size="17">町での帰還報告：q001-S-post ／ 結末：q001-E-*</text>
<text x="60" y="871" font-size="17">文字は配置点の案内。イベントIDは右欄と本文で共通。</text>
<text x="802" y="151" font-size="21">A　(1, 1) 灯を受け渡す準備</text>
<text x="832" y="178" font-family="monospace" font-size="17">q001-P-kagaribi</text>
<text x="802" y="223" font-size="21">B　(2, 1) 入口の灯</text>
<text x="832" y="250" font-family="monospace" font-size="17">q001-S-entry</text>
<text x="832" y="273" font-family="monospace" font-size="17">q001-S-gate</text>
<text x="832" y="296" font-family="monospace" font-size="17">q001-P-decision</text>
<text x="802" y="341" font-size="21">C　(8, 1) 西の壁松明</text>
<text x="832" y="368" font-family="monospace" font-size="17">q001-P-empty_west</text>
<text x="802" y="413" font-size="21">D　(9, 1) 油の尽きた巡灯路</text>
<text x="832" y="440" font-family="monospace" font-size="17">q001-S-dark</text>
<text x="832" y="463" font-family="monospace" font-size="17">q001-S-empty</text>
<text x="832" y="486" font-family="monospace" font-size="17">q001-S-outage</text>
<text x="832" y="509" font-family="monospace" font-size="17">q001-S-rescue</text>
<text x="832" y="532" font-family="monospace" font-size="17">q001-P-return</text>
<text x="802" y="577" font-size="21">E　(11, 1) 東の壁松明</text>
