<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音・戦闘演出の編集 — 灯帰りの迷宮</title>
<link rel="stylesheet" href="src/view/style.css"><link rel="stylesheet" href="src/view/presentation-editor.css"></head>
<body class="presentation-editor">
<header><div><p class="eyebrow">灯帰りの迷宮 / 制作ツール</p><h1>音・戦闘演出の編集</h1></div><nav><a href="battle-engine-playtest.html">戦闘で確認</a><a href="doc/ui/SOUND_AND_EFFECT_FORMAT.md">記述形式</a></nav></header>
<main>
<section class="preview-panel" aria-label="試聴・試写">
  <div class="presentation-toolbar"><label>種類<select id="category"><option value="profiles">合成音</option><option value="particles">粒子</option><option value="paths">軌道・残像</option><option value="timelines">組み合わせ</option></select></label><label class="grow">プリセット<select id="preset"></select></label></div>
  <div id="stage" aria-label="演出プレビュー"><span class="stage-label">PREVIEW</span><div class="performer source"><img data-fx="actor:preview" src="assets/images/portraits/ada.webp" alt="攻撃側"><span>攻撃側</span></div><div class="performer target"><img data-fx="enemy:enemy_0" src="assets/images/monsters/construct.webp" alt="対象"><span>対象</span></div></div>
  <div class="presentation-toolbar"><button id="play" class="primary" type="button">▶ 再生</button><button id="stop" type="button">停止</button><label>再生対象<select id="preview-mode"><option value="both">音と映像</option><option value="sound">音のみ</option><option value="visual">映像のみ</option></select></label><label>動き<select id="motion"><option value="full">通常</option><option value="reduced">控える</option><option value="off">切</option></select></label></div>
  <div class="presentation-toolbar"><label>音量<input id="volume" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>材質<select id="material"><option value="">重ねない</option><option value="flesh">肉体</option><option value="metal">金属</option><option value="shield">盾</option><option value="stone">石</option><option value="wood">木</option><option value="water">水</option></select></label><label>左右<input id="pan" type="range" min="-1" max="1" step="0.05" value="0"></label><label>距離<input id="distance" type="number" min="0" max="10" step="0.1" value="0"></label></div>
  <progress id="progress" value="0" max="1" aria-label="再生位置"></progress>
  <ol id="timeline" aria-label="再生順序"></ol>
  <canvas id="waveform" width="900" height="140" aria-label="合成音の波形"></canvas><p id="wave-status">波形は再生後に表示します。</p>
  <div class="presentation-toolbar"><button id="capture-a" type="button">現在をAに保持</button><button id="play-a" type="button" disabled>Aを再生</button><button id="play-b" type="button">B（編集中）を再生</button><button id="restore-a" type="button" disabled>Aを編集へ戻す</button></div>
  <p id="status" role="status" aria-live="polite">読み込み中…</p>
</section>
<section class="edit-panel" aria-label="定義の編集">
  <div class="presentation-toolbar"><h2>選択項目の設定</h2><label><input id="live" type="checkbox">変更後に再生</label></div>
  <div id="quick-controls"></div>
  <label for="item-json">詳細設定</label><textarea id="item-json" spellcheck="false" aria-describedby="edit-help"></textarea>
  <p id="edit-help">音量・音程の曲線、音色加工、粒子の動き、開始時刻などを編集できます。適用時に値と参照を検査します。</p>
  <div class="presentation-toolbar"><button id="apply-item" class="primary" type="button">設定を適用</button><button id="reset-item" type="button">適用済みに戻す</button></div>
  <details><summary>共通定義全体 / JSONの読込・書出</summary><label for="document-json">全体の定義</label><textarea id="document-json" spellcheck="false"></textarea><div class="presentation-toolbar"><button id="apply-document" type="button">全体を適用</button><button id="export" type="button">JSONを書き出す</button><label class="file-button">JSONを読み込む<input id="import" type="file" accept=".json,application/json"></label></div></details>
</section>
</main><script type="module" src="src/presentation-editor.js"></script></body></html>
