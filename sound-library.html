<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SE・音源管理 — 灯帰りの迷宮</title><link rel="stylesheet" href="src/view/sound-library.css">
</head><body>
<header><div><a href="index.html">灯帰りの迷宮</a><h1>SE・音源管理</h1></div>
<nav aria-label="制作ツール"><a href="battle-engine-playtest.html">戦闘で確認</a><a href="battle-presentation-editor.html">戦闘演出の編集</a></nav></header>
<main>
<section class="audition"><div><h2>攻撃の聞き比べ</h2><p>通常攻撃を、予備動作から命中・空振りまで試聴できます。</p></div>
<div class="controls"><label>攻撃側<select id="side"><option value="ally">味方</option><option value="enemy">敵</option></select></label>
<label>攻撃音<select id="windup-version"><option value="current">本編（A03 戦列の号令／E07 魔将の宣告）</option><option value="v2">合成版・二版</option><option value="v1">合成版・初版</option></select></label>
<label>結果<select id="result"><option value="hit">命中</option><option value="miss">空振り（開始音のみ）</option></select></label>
<button id="attack" class="primary" disabled>▶ 攻撃を試聴</button></div>
<nav><a href="assets/audio/auditions/windup-20/index.html">開始音の候補を試聴（味方10種・敵10種）</a></nav></section>
<div class="transport"><label>試聴音量 <input id="volume" type="range" min="0" max="100" value="60"> <output for="volume" id="level">60%</output></label><button id="stop">■ 停止</button><span id="status" role="status">音源を読み込み中…</span></div>
<div class="workspace">
<section class="catalog" id="catalog"><h2>音源一覧 <small id="count"></small></h2>
<div class="controls"><label class="search">検索<input id="search" type="search" placeholder="名前・ID・用途"></label>
<label>種類<select id="kind"><option value="">すべて</option><option value="synth">合成SE</option><option value="se">収録SE</option><option value="bgm">BGM</option><option value="sample">命中音サンプル</option></select></label></div>
<nav aria-label="命中音サンプル"><a href="?kind=sample#catalog">命中音サンプル10種</a> <a href="assets/audio/auditions/attack-v1/adv-attack-se-10.mp4">初版の比較動画</a> <a href="assets/audio/auditions/attack-v1/adv-attack-se-10-wav.zip" download>WAV一式</a></nav>
<div id="list" aria-label="音源を選択"></div></section>
<section aria-labelledby="title" class="detail" id="detail" hidden><small id="type"></small><h2 id="title"></h2><code id="identifier"></code><p id="use"></p>
<div class="controls"><button class="primary" id="preview">▶ 選択音を試聴</button><a id="source"></a></div>
<form id="edit" hidden><h3>収録SEの設定</h3><label>表示名<input id="name" required maxlength="80"></label>
<label>ゲーム内音量 <input id="gain" type="range" min="0" max="1" step="0.01"><output for="gain" id="gain-value"></output></label>
<div class="controls"><button>変更を保存</button><button type="button" id="reset">この音を初期値に戻す</button></div>
<p>変更はこのブラウザーに保存され、試聴にも反映されます。本編への取り込みには設定ファイルを書き出してください。</p>
<button type="button" id="export">設定を書き出す（presentation.json）</button></form>
</section></div></main>
<script type="module" src="src/sound-library.js"></script></body></html>
