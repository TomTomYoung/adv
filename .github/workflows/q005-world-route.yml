name: Validate q005 drainage routes in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/story-q005.mjs'
      - 'tools/build-q005-world-route.mjs'
      - 'tools/browser-q005-world-route-smoke.mjs'
      - 'tools/q005-world-route-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tests/q005-*.mjs'
      - 'tests/fixtures/e2-q005-before-world.json'
      - 'assets/images/**'
      - '.github/workflows/q005-world-route.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  q005-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver and verify Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          test -n "$(fc-list :lang=ja)"
      - name: Check routes, casting, shortages, rescue and accepted saves
        run: ADV_BROWSER_OUTPUT=/tmp/adv-drainage-art-browser node tools/browser-q005-world-route-smoke.mjs
      - name: Keep q005 checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q005-world-route-checkpoints
          path: /tmp/adv-drainage-art-browser
          if-no-files-found: error
          retention-days: 7
