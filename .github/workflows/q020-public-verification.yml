name: Verify public q020 files and playtest startup
on:
  push:
    branches:
      - codex/q020-public-q021-audit-20261119
    paths:
      - '.github/workflows/q020-public-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare public deployment bytes to merged master
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const paths=['runtime.json','data/scenario-editions.json','data/scenario-editions/e2/q020.json','data/scenario-editions/e2/geography.json','data/scenario-editions/e2/companions.json','data/quests/q020.json','playtests/quest-parties.json'];
          const hash=x=>createHash('sha256').update(x).digest('hex');
          const report=[];
          for(const p of paths){
            const local=await fs.readFile(p);
            const url='https://tomtomyoung.github.io/adv/'+p+'?verify=1afb4c2b';
            let remote,reason;
            for(let attempt=0;attempt<5;attempt++){
              try{const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(25000)});
                if(response.status!==200)throw Error('HTTP '+response.status);
                remote=Buffer.from(await response.arrayBuffer());
                if(hash(remote)===hash(local))break;
                throw Error('byte hash mismatch');
              }catch(error){reason=error.message;remote=null;if(attempt<4)await new Promise(ok=>setTimeout(ok,5000));}
            }
            assert.ok(remote,p+': '+reason);
            assert.equal(hash(remote),hash(local),p+' public bytes match merged master');
            report.push({path:p,bytes:local.length,sha256:hash(local)});
          }
          const current=JSON.parse(await fs.readFile('data/scenario-editions/e2/q020.json','utf8'));
          assert.equal(Object.keys(current.story.scenes).length,29);
          assert.equal(Object.keys(current.story.actions).length,35);
          assert.equal(Object.values(current.story.actions).filter(a=>a.journey).length,21);
          console.log('PUBLIC BYTE AUDIT '+JSON.stringify(report));
          JS
      - name: Launch public q020 playtest in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const errors=[];
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.on('pageerror',e=>errors.push(e.message));
            page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))errors.push(r.status()+' '+r.url());});
            await page.goto('https://tomtomyoung.github.io/adv/quest-party-playtest.html?edition=e2&quest=q020&party=balanced&level=2&start=site&outcome=informed&seed=1907',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#launch')&&!document.querySelector('#launch').disabled,{timeout:90000});
            await page.locator('#launch').click();
            await page.waitForFunction(()=>window.questPlaytest?.trial?.engine?.state?.stories?.q020?.scene==='entry',{timeout:30000});
            const snapshot=await page.evaluate(()=>{const q=window.questPlaytest;const g=q.trial.engine;const initial={scene:g.state.stories.q020.scene,stage:g.state.quests.q020.stage,edition:g.data.scenarioEdition,options:g.data.quests.q020.model.graph.find(n=>n.id==='entry').options.map(x=>x.id),name:g.data.quests.q020.title,output:document.querySelector('#trial-status').textContent};for(let n=0;n<30&&g.state.waiting?.type==='text';n++)q.dispatch({type:'advance'});initial.choiceWaiting=g.state.waiting?.type;initial.accepted=q.dispatch({type:'choose',id:'relieve'});initial.nextJourney=g.state.journey?.action??null;initial.handoverRequested=g.state.stories.q020.values.handoverRequested;return initial;});
            assert.equal(snapshot.edition,'e2');assert.equal(snapshot.scene,'entry');assert.equal(snapshot.stage,'active');assert.ok(snapshot.options.includes('relieve'));assert.ok(snapshot.options.includes('fight'));assert.equal(snapshot.accepted,true);assert.equal(snapshot.nextJourney,'entry_relieve');assert.equal(snapshot.handoverRequested,true);
            assert.deepEqual(errors,[]);
            console.log('PUBLIC BROWSER START '+JSON.stringify(snapshot));
          } finally{await browser.close();}
          JS
