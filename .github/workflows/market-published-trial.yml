name: Verify deployed q052–q055 market routes
on:
  push:
    branches: [master]
    paths:
      - 'data/scenario-editions/e2/q05[2-5].json'
      - 'tools/verify-market-published.mjs'
      - '.github/workflows/market-published-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: node tools/verify-market-published.mjs
