name: Verify published q018 trial
on:
  push:
    branches: ['codex/prepare-q018-20261118']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Play the published trial and compare its six files
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const expected=JSON.parse(await fs.readFile('runtime.json','utf8')).revision;
          for(let i=0;i<24;i++){
            const published=await fetch('https://tomtomyoung.github.io/adv/runtime.json?check='+Date.now()).then(r=>r.json()).catch(()=>null);
            if(published?.revision===expected) break;
            if(i===23)throw Error('Published runtime has not reached the merge');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          JS
          PROOF_ORIGIN=https://tomtomyoung.github.io/adv node qa-q018-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q018-public-trial
          path: /tmp/adv-q018-proof
          retention-days: 7
