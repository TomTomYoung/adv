name: Verify published handoff for q019
on:
  push:
    branches: ['codex/prepare-q018-20261118']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match the handoff and route documents to the merged tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from time import sleep, time_ns
          from urllib.request import urlopen
          from urllib.error import HTTPError, URLError
          paths = ['doc/HANDOFF.md','doc/development/Q018_WORLD_ROUTE.md','doc/development/Q019_WORLD_ROUTE_PLAN.md']
          for retry in range(24):
              try:
                  for path in paths:
                      with urlopen('https://tomtomyoung.github.io/adv/'+path+'?version='+str(time_ns()),timeout=15) as response:
                          if response.read()!=Path(path).read_bytes():
                              break
                  else:
                      print('PUBLISHED DOCUMENTS MATCH',len(paths))
                      break
              except (HTTPError, URLError):
                  pass
              sleep(10)
          else:
              raise RuntimeError('Published files have not reached the merged version')
          PY
