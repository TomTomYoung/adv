name: Validate Oddland border and quests in Chromium
on:
  pull_request:
    paths:
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'data/scenario-editions.json'
      - 'tools/browser-oddland-smoke.mjs'
      - 'tools/browser-observatory-cast-smoke.mjs'
      - 'tools/quiver-art-fixtures.mjs'
      - 'tests/fixtures/e2-q181-before-cast.json'
      - 'tools/browser-bridge-cast-smoke.mjs'
      - 'tools/bridge-art-fixtures.mjs'
      - 'tests/fixtures/e2-q185-before-cast.json'
      - 'tools/browser-flagless-soldier-cast-smoke.mjs'
      - 'tools/flagless-soldier-art-fixtures.mjs'
      - 'tests/fixtures/e2-q187-before-cast.json'
      - 'tools/browser-truce-cast-smoke.mjs'
      - 'tools/truce-art-fixtures.mjs'
      - 'tests/fixtures/e2-q186-before-cast.json'
      - 'tools/browser-pot-cast-smoke.mjs'
      - 'tools/pot-art-fixtures.mjs'
      - 'tests/fixtures/e2-q184-before-cast.json'
      - 'tools/browser-laundry-cast-smoke.mjs'
      - 'tools/laundry-art-fixtures.mjs'
      - 'tests/fixtures/e2-q183-before-cast.json'
      - 'tools/browser-gunner-cast-smoke.mjs'
      - 'tools/gunner-art-fixtures.mjs'
      - 'tests/fixtures/e2-q182-before-cast.json'
      - 'tools/browser-settlement-checkpoint.mjs'
      - 'assets/images/locations/**'
      - 'data/assets.json'
      - '.github/workflows/oddland-quests.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  oddland-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: oddland-browser
      - name: Install browser test runtime
        if: steps.ci.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium --only-shell
          # Playwright's Linux dependencies include IPA Gothic for Japanese.
          test -n "$(fc-list :lang=ja)"
      - name: Verify border, pilgrimage roads and complete quests in both layouts and widths
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-oddland-smoke.mjs
      - name: Keep Oddland viewport checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oddland-browser-checkpoints
          path: /tmp/adv-oddland-browser
          if-no-files-found: ignore
      - name: Verify q181 cast, quiver custody and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-quiver-art-browser
        run: node tools/browser-observatory-cast-smoke.mjs
      - name: Keep q181 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q181-cast-checkpoints
          path: /tmp/adv-quiver-art-browser
          if-no-files-found: ignore
      - name: Verify q182 cast, one charge and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-gunner-art-browser
        run: node tools/browser-gunner-cast-smoke.mjs
      - name: Keep q182 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q182-cast-checkpoints
          path: /tmp/adv-gunner-art-browser
          if-no-files-found: ignore
      - name: Verify q183 cast, aid delivery and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-laundry-art-browser
        run: node tools/browser-laundry-cast-smoke.mjs
      - name: Keep q183 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q183-cast-checkpoints
          path: /tmp/adv-laundry-art-browser
          if-no-files-found: ignore
      - name: Verify q184 cast, pot handovers and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-pot-art-browser
        run: node tools/browser-pot-cast-smoke.mjs
      - name: Keep q184 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q184-cast-checkpoints
          path: /tmp/adv-pot-art-browser
          if-no-files-found: ignore
      - name: Verify q185 cast, crossings, battle recovery and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-bridge-art-browser
        run: node tools/browser-bridge-cast-smoke.mjs
      - name: Keep q185 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q185-cast-checkpoints
          path: /tmp/adv-bridge-art-browser
          if-no-files-found: ignore
      - name: Verify q186 cast, limited agreement, exchange, battle recovery and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-truce-art-browser
        run: node tools/browser-truce-cast-smoke.mjs
      - name: Keep q186 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q186-cast-checkpoints
          path: /tmp/adv-truce-art-browser
          if-no-files-found: ignore
      - name: Verify q187 cast, evacuation, battle recovery and current saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-flagless-soldier-art-browser
        run: node tools/browser-flagless-soldier-cast-smoke.mjs
      - name: Keep q187 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q187-cast-checkpoints
          path: /tmp/adv-flagless-soldier-art-browser
          if-no-files-found: error
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
