name: q072 isolated validation
on:
  push:
    branches: [feature/machine-q072-cast]
    paths: [.github/workflows/q072-work.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source snapshot
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          tar -czf "$RUNNER_TEMP/adv-source.tgz" --exclude='./.git' --exclude='./assets' .
      - uses: actions/upload-artifact@v4
        with:
          name: q072-source-worktree
          path: |
            ${{ runner.temp }}/adv-source.tgz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
