name: q072 isolated validation
on:
  push:
    branches: [feature/machine-q072-cast]
    paths: [.github/workflows/q072-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q072-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locally tested sources
        run: |
          sha256sum -c <<'HASHES'
          2fb04c73b61717bc312a051892eb718595e3e1553dc0a2b169d2433cd9fd6b85  tools/apply-q072-work.mjs
          956a59a2c942e642ca82da39de7e33e1c9bdcb4acd7a0546383f092f50c792d5  tests/oil-baptism-cast.test.mjs
          a0d49a7429033c714ffeba4a9ef1825e477570461d44685c9a32953335ab55a5  tools/oil-baptism-art-fixtures.mjs
          b8ec000b54871edb7fb8e93b516a47eece9ea21782b9fb685be96f3531776303  tools/measure-oil-baptism.mjs
          7e171787b0cb63dabe6a58f6e241dd7260d68b80ec74155213402c432a1f9dbc  tools/browser-oil-baptism-cast-smoke.mjs
          HASHES
      - name: Apply source-checked repair and preserve previous quest
        run: node tools/apply-q072-work.mjs
      - name: Verify migration, repaired route, interruptions and previous regressions
        run: |
          node --test tests/oil-baptism-cast.test.mjs tests/relocated-cast-audit.test.mjs
          node --test --test-name-pattern='q072' tests/machine.test.mjs
      - name: Reproduce five normal party routes and record verified results
        run: |
          node tools/measure-oil-baptism.mjs doc/development/Q072_PLAYTEST_RESULTS.json
          node tools/apply-q072-work.mjs --record
          git rm tools/apply-q072-work.mjs
      - name: Generate snapshot and runtime while preserving authored records
        run: |
          cp -a doc "$RUNNER_TEMP/q072-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q072-authored-docs/$file" "doc/$file"
          done
          node tools/build-runtime.mjs
      - name: Validate generated content, assets, static references and documentation
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(q072): restore heating-first oil consultation and connect workshop cast"
          git push origin HEAD:feature/machine-q072-cast
