name: q089 isolated validation
on:
  push:
    branches: [feature/observatory-q089-audit]
    paths: [.github/workflows/q089-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/observatory-q089-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locally tested source bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const expected={"tools/q089-apply.mjs":"7a758cd8783999284c7185f0b5d1d737f90dbbcc0ce59988e1ad3499a5ed38c0","tools/q089-notes.mjs":"eb6a997ff2ea55e617e2694c73d0efdd0104cbbb2d64d33d91a6c167548fb81a","tools/calendar-transition-art-fixtures.mjs":"84b921f0e923e7fa6964e96ee160cac7e61371a9e8a5efd1b62644d2f56840ce","tests/calendar-transition-cast.test.mjs":"2898b0968629f9a9a32d48db9d462d29574c5acdc06b69ae9b8d3c932c010fed","tools/measure-calendar-transition.mjs":"cb308b1220f365a1398d4388cce8407d32a275bba9ae811e8a76a2700eb919a1","tools/browser-calendar-transition-cast-smoke.mjs":"6aec96f8dad9e7cf78cacdd5be717c0e7191ea42dabb6e2fef87719a2c6d551d",".github/workflows/q089-cast.yml":"71700ad5d8f12da868f11bcbf4b410f7905e9e2de774af31ee7de1d47612cbce"};
          for(const [p,h] of Object.entries(expected))assert.equal(createHash('sha256').update(fs.readFileSync(p)).digest('hex'),h,p);
          JS
      - name: Apply audited cast and preserve exact previous quest
        run: |
          node tools/q089-apply.mjs
          node tools/audit-relocated-cast.mjs
      - name: Check all paths, agreement order, old saves and interruption recovery
        run: node --test tests/calendar-transition-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/observatory*.test.mjs
      - name: Reproduce nine ordinary party trials
        run: node tools/measure-calendar-transition.mjs doc/development/Q089_PLAYTEST_RESULTS.json
      - name: Generate documents and runtime while preserving authored records
        run: |
          node tools/q089-notes.mjs
          cp -a doc "$RUNNER_TEMP/q089-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q089-authored-docs/$file" "doc/$file"
          done
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm tools/q089-apply.mjs tools/q089-notes.mjs
      - name: Validate generated content, assets, references and documentation
        run: |
          node tools/build-runtime.mjs --check
          node tools/build-scenario-editions.mjs --check
          node tools/validate.mjs
          node tools/check-config-editors.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q089): fixed consultation casts, atomic save migration and calendar verification"
          git push origin HEAD:feature/observatory-q089-audit
