name: q075 isolated validation
on:
  push:
    branches: [feature/machine-q075-cast]
    paths: [.github/workflows/q075-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q075-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locally tested sources
        run: |
          cat <<'HASHES' | sha256sum -c -
          e9bf861061f14ca7e925dd563ebd516911076938d619cf10a14eaab3bedb2320  tools/apply-q075-work.mjs
          d5c83e5c6092df95becd6fe29bf7a7d4c0f31ffe93d6d7d5928d8fe7735c59ea  tools/unpaid-saint-art-fixtures.mjs
          bc6839c94744f055636cef0b44972f5eb3b6b1855ab44be666ac28ed96c04ed2  tests/unpaid-saint-cast.test.mjs
          8507d3e1032dcdb94660cfa26f2fcb6db161a63fd1208da7d83973c5cf439cfc  tools/measure-unpaid-saint.mjs
          6bf7a65670a1233b460ee15b9ea7e76a2d3106d9e86944f0f32d914ac77a1f00  tools/browser-unpaid-saint-cast-smoke.mjs
          a1ac419b87ebe13e73551f79480a3ac57c0c02991b549bdec0e64fe1dd34a2db  tools/record-q075-work.mjs
          HASHES
      - name: Apply source-checked cast and preserve previous quest
        run: node tools/apply-q075-work.mjs
      - name: Verify all routes, saves, battle recovery and existing machine regressions
        run: node --test tests/unpaid-saint-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/machine.test.mjs
      - name: Reproduce five normal party trials and record results
        run: |
          node tools/measure-unpaid-saint.mjs doc/development/Q075_PLAYTEST_RESULTS.json
          node tools/record-q075-work.mjs
      - name: Generate snapshot and runtime while preserving authored documents
        run: |
          cp -a doc "$RUNNER_TEMP/q075-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q075-authored-docs/$file" "doc/$file"
          done
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm tools/apply-q075-work.mjs tools/record-q075-work.mjs
      - name: Validate generation, distribution hashes, assets, static references and docs
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q075): worker escorts, original saves and delivery verification"
          git push origin HEAD:feature/machine-q075-cast
