name: q078 isolated validation
on:
  push:
    branches: [feature/machine-q078-cast]
    paths: [.github/workflows/q078-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q078-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align only the new handoff references with canonical q079 title
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const q=JSON.parse(fs.readFileSync('data/scenario-editions/e2/q079.json','utf8'));
          assert.equal(q.title,'九十九回の再起動');
          const before='次はq079「百回目の試験」',after='次はq079「'+q.title+'」';
          for(const p of ['authoring/relocated-cast-review.mjs','doc/HANDOFF.md','doc/CURRENT_STATUS.md','doc/development/PROGRESS.md','doc/development/REMAINING_WORK.md','doc/development/TEST_OVERVIEW.md']){
            const s=fs.readFileSync(p,'utf8');assert.equal(s.split(before).length,2,p);
            fs.writeFileSync(p,s.replace(before,after));
          }
          JS
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          node --test tests/relocated-cast-audit.test.mjs
          node tools/check-docs.mjs
      - name: Commit the verified documentation correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/relocated-cast-review.mjs doc/HANDOFF.md doc/CURRENT_STATUS.md doc/development/PROGRESS.md doc/development/REMAINING_WORK.md doc/development/TEST_OVERVIEW.md doc/scenarios/RELOCATED_CAST_AUDIT.json doc/scenarios/RELOCATED_CAST_AUDIT.md runtime.json
          git commit -m "docs(q078): correct next quest title to q079 canonical title"
          git push origin HEAD:feature/machine-q078-cast
