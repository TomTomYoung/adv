name: Play q019 mine scale in Chromium
on:
  push:
    branches: ['codex/verify-q019-20261119']
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify the distribution and play the partial repayment route
        run: node qa-q019-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q019-trial-screens-and-result
          path: /tmp/mine-scale-trial
          retention-days: 7
