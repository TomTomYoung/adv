name: Apply and verify exploration revision
on:
  push:
    branches: [fix/exploration-and-plain-narration]
    paths: ['.transfer/adv-exploration/**', '.github/workflows/transfer-exploration.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/exploration-and-plain-narration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the locally tested source patch, with pinned digest
        run: |
          test "$(git rev-parse HEAD^)" = 8bf72885dcda38c944ebc90abe7a0ca2a1a380bd
          python3 - <<'PY'
          import pathlib,hashlib,lzma,subprocess,os
          parts=[pathlib.Path('.transfer/adv-exploration/p'+str(i)).read_bytes() for i in range(6)]
          patch=lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest()=='2acc97eaf5a53b4aac891eca9cb000d0f883d0d5f29628091506875f9632a1c8'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'adv-exploration.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Reproduce the baseline structural fixture from the pinned original commit
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {loadContent} from './src/core/loader.js';
          import {structureHash} from './tests/narration-helpers.mjs';
          const base='8bf72885dcda38c944ebc90abe7a0ca2a1a380bd';
          const d=await loadContent(async f=>JSON.parse(execFileSync('git',['show',`${base}:${f}`],{encoding:'utf8',maxBuffer:16000000})));
          const out={source:`TomTomYoung/adv@${base} (1.10.0)`,quests:Object.fromEntries(Object.entries(d.quests).map(([k,v])=>[k,structureHash(v)])),scripts:Object.fromEntries(Object.entries(d.scripts).map(([k,v])=>[k,structureHash(v)])),objects:Object.fromEntries(Object.entries(d.maps).map(([k,m])=>[k,Object.fromEntries(m.objects.map(o=>[o.id,structureHash(o)]))]))};
          const text=JSON.stringify(out,null,2)+'\n';
          if(createHash('sha256').update(text).digest('hex')!=='b6ed86af0d0b828f407bfe9efd0aacb6a93a0650257c10aa834164606b5f6a2f')throw new Error('Baseline fixture mismatch');
          await fs.writeFile('tests/fixtures/pre-1.11-structure.json',text);
          JS
      - name: Remove transport files and rebuild the final product
        run: |
          rm -rf .transfer/adv-exploration
          rm .github/workflows/transfer-exploration.yml
          npm run build:scenarios
          node tools/build-fixtures.mjs
      - name: Validate code, all quest endings, exploration, saves and documentation
        run: |
          node tools/validate.mjs
          node tools/check-static.mjs
          node --test --test-concurrency=2 tests/*.test.mjs
          npm run check:docs
      - name: Match every changed file to the locally validated files
        run: |
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import pathlib,hashlib,subprocess
          base='8bf72885dcda38c944ebc90abe7a0ca2a1a380bd'
          files=sorted(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())
          assert len(files)==250, len(files)
          digest=hashlib.sha256()
          for name in files:
              assert not name.startswith('.transfer/') and name!='.github/workflows/transfer-exploration.yml'
              digest.update(name.encode()+b'\n')
              digest.update(pathlib.Path(name).read_bytes())
          actual=digest.hexdigest()
          print('VERIFIED 250 FILES SHA256:',actual)
          assert actual=='dcac4e75535f70b0de46f9adc67d70937fb67bc1bcd0d66f8a1a1158a0dea9a7'
          PY
      - name: Commit the tested result to the work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Require exploration for q001 and q003; normalize scenario narration' -m 'Preserve q002 journeys and character dialogue. Gate services by real location. Verify 475 tests and all 250 changed files against the locally tested digest. Update catalog and handoff; q004 onward remains next.'
          git push origin HEAD:refs/heads/fix/exploration-and-plain-narration
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
