name: q147 isolated validation
on:
  push:
    branches: [feature/library-q147-cast]
    paths: [.github/workflows/q147-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-q147-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified source patch
        run: node tools/q147-transfer/apply.mjs
      - name: Generate quest, audit, docs and runtime
        run: |
          cp -a doc "$RUNNER_TEMP/q147-authored-docs"
          node tools/build-scenario-editions.mjs
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q147-authored-docs/$file" "doc/$file"
          done
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm -r tools/q147-transfer
      - name: Validate q147, cast audit, generated content and document references
        run: |
          node --test tests/flower-delivery-cast.test.mjs tests/relocated-cast-audit.test.mjs
          node tools/build-scenario-editions.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation and generated files
        run: |
          # Workflow changes are applied separately through the authorized connector.
          git restore --source=HEAD --staged --worktree .github/workflows/salome-quests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q147): recipient display, atomic save migration and delivery verification"
          git push origin HEAD:feature/library-q147-cast
      - name: Keep transport diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: q147-transfer-diagnostics
          path: /tmp/q147-received-payload.txt
          if-no-files-found: ignore
          retention-days: 1
