name: Validate q079 restart ledger in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/salome/machine-first.mjs'
      - 'tools/build-machine-quests.mjs'
      - 'tools/browser-restart-ledger-smoke.mjs'
      - 'tools/restart-ledger-art-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tests/restart-ledger.test.mjs'
      - 'tests/fixtures/e2-q079-before-audit.json'
      - 'assets/images/**'
      - '.github/workflows/q079-audit.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  q079-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver and verify Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          test -n "$(fc-list :lang=ja)"
      - name: Check absent cast, board custody, shutdown, backup, restart and older saves
        run: ADV_BROWSER_OUTPUT=/tmp/adv-restart-ledger-browser node tools/browser-restart-ledger-smoke.mjs
      - name: Keep q079 checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q079-audit-checkpoints
          path: /tmp/adv-restart-ledger-browser
          if-no-files-found: error
          retention-days: 7
