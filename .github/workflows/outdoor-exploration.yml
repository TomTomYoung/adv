name: Validate outdoor exploration in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'tools/browser-outdoor-smoke.mjs'
      - '.github/workflows/outdoor-exploration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outdoor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium --only-shell
          test -n "$(fc-list :lang=ja)"
      - name: Check nine outdoor maps in both layouts and widths
        run: node tools/browser-outdoor-smoke.mjs
      - name: Keep outdoor viewport checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outdoor-browser-checkpoints
          path: /tmp/adv-outdoor-browser
          if-no-files-found: ignore
