name: q022 original route checkpoint audit
on:
  push:
    branches:
      - codex/q022-sleep-spores-plan-20261119
    paths:
      - .github/workflows/q022-original-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q022-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/q022-sleep-spores-plan-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run original q022 complete states with real combat and save
        run: node --test tests/q022-original-audit.test.mjs
