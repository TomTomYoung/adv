name: Battle impact feedback
on:
  pull_request:
    paths:
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/core/battle.js'
      - 'src/core/feedback*'
      - 'src/view/**'
      - 'src/application/audio.js'
      - 'src/application/battle-sound.js'
      - 'src/battle-accent.js'
      - 'src/presentation-*.js'
      - 'config/battle-presentation.json'
      - 'battle-presentation-editor.html'
      - 'src/main.js'
      - 'src/battle-engine-playtest.js'
      - 'config/presentation.json'
      - 'data/effects.json'
      - 'data/presentation.json'
      - 'tools/browser-effects-smoke.mjs'
      - '.github/workflows/battle-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battle-feedback-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: battle-feedback-browser
      - run: npm install --no-save --package-lock=false playwright@1.58.2
        if: steps.ci.outputs.run == 'true'
      - run: node tools/browser-effects-smoke.mjs
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-effects-browser
      - uses: actions/upload-artifact@v4
        if: always() && steps.ci.outputs.run == 'true'
        with:
          name: battle-feedback
          path: /tmp/adv-effects-browser
          retention-days: 7
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
