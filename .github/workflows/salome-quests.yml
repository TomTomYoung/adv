name: Validate Salome access and library quests in Chromium
on:
  pull_request:
    paths:
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'data/scenario-editions.json'
      - 'tools/browser-salome-smoke.mjs'
      - 'tools/browser-bookmark-cast-smoke.mjs'
      - 'tools/bookmark-art-fixtures.mjs'
      - 'tests/fixtures/e2-q049-before-cast.json'
      - 'tools/browser-proofreader-cast-smoke.mjs'
      - 'tools/proofreader-art-fixtures.mjs'
      - 'tests/fixtures/e2-q048-before-cast.json'
      - 'tools/browser-war-page-cast-smoke.mjs'
      - 'tools/war-page-art-fixtures.mjs'
      - 'tests/fixtures/e2-q047-before-cast.json'
      - 'tools/browser-index-cast-smoke.mjs'
      - 'tools/index-art-fixtures.mjs'
      - 'tests/fixtures/e2-q046-before-cast.json'
      - 'tools/browser-inheritance-cast-smoke.mjs'
      - 'tools/inheritance-art-fixtures.mjs'
      - 'tests/fixtures/e2-q045-before-cast.json'
      - 'tools/browser-obituary-cast-smoke.mjs'
      - 'tools/obituary-art-fixtures.mjs'
      - 'tests/fixtures/e2-q044-before-cast.json'
      - 'tools/browser-ink-fire-cast-smoke.mjs'
      - 'tools/ink-fire-art-fixtures.mjs'
      - 'tools/browser-hourglass-cast-smoke.mjs'
      - 'tools/hourglass-art-fixtures.mjs'
      - 'tests/fixtures/e2-q042-before-cast.json'
      - 'tools/browser-borrower-cast-smoke.mjs'
      - 'tools/borrower-art-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tests/fixtures/e2-q041-before-cast.json'
      - 'tools/browser-settlement-checkpoint.mjs'
      - 'assets/images/locations/**'
      - 'data/assets.json'
      - '.github/workflows/salome-quests.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  salome-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: salome-browser
      - name: Install browser and Japanese fonts
        if: steps.ci.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          # The pinned Playwright image includes Japanese font dependencies.
          test -n "$(fc-list :lang=ja)"
      - name: Walk to Salome, complete personal and regional library quests, and return in both layouts and widths
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-salome-smoke.mjs
      - name: Keep Salome viewport checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salome-browser-checkpoints
          path: /tmp/adv-salome-browser
          if-no-files-found: ignore
      - name: Check q041 borrower and clerk casts, return routes, and old saves
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-borrower-cast-smoke.mjs
      - name: Keep q041 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q041-cast-checkpoints
          path: /tmp/adv-library-art-browser
          if-no-files-found: ignore
      - name: Check q042 hourglass casts, shift timing, and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-hourglass-art-browser node tools/browser-hourglass-cast-smoke.mjs
      - name: Keep q042 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q042-cast-checkpoints
          path: /tmp/adv-hourglass-art-browser
          if-no-files-found: ignore
      - name: Check q043 conditional text, irreversible loss, empty casts and older saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-ink-fire-art-browser node tools/browser-ink-fire-cast-smoke.mjs
      - name: Keep q043 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q043-cast-checkpoints
          path: /tmp/adv-ink-fire-art-browser
          if-no-files-found: ignore
      - name: Check q044 casts, evacuation, return destinations and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-obituary-art-browser node tools/browser-obituary-cast-smoke.mjs
      - name: Keep q044 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q044-cast-checkpoints
          path: /tmp/adv-obituary-art-browser
          if-no-files-found: ignore
      - name: Check q045 heirs, draft custody, deposit routes and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-inheritance-art-browser node tools/browser-inheritance-cast-smoke.mjs
      - name: Keep q045 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q045-cast-checkpoints
          path: /tmp/adv-inheritance-art-browser
          if-no-files-found: ignore
      - name: Check q046 reader, repeatable index loops, exit origins and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-index-art-browser node tools/browser-index-cast-smoke.mjs
      - name: Keep q046 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q046-cast-checkpoints
          path: /tmp/adv-index-art-browser
          if-no-files-found: ignore
      - name: Check q047 recordkeepers, vault recipients, cross-border delivery and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-war-page-art-browser node tools/browser-war-page-cast-smoke.mjs
      - name: Keep q047 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q047-cast-checkpoints
          path: /tmp/adv-war-page-art-browser
          if-no-files-found: ignore
      - name: Check q048 proofreader, client arrivals, repeated correction, team escort and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-proofreader-art-browser node tools/browser-proofreader-cast-smoke.mjs
      - name: Keep q048 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q048-cast-checkpoints
          path: /tmp/adv-proofreader-art-browser
          if-no-files-found: ignore
      - name: Check q049 explorer, sealed document and map copy deliveries, interrupted journeys and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-bookmark-art-browser node tools/browser-bookmark-cast-smoke.mjs
      - name: Keep q049 checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q049-cast-checkpoints
          path: /tmp/adv-bookmark-art-browser
          if-no-files-found: ignore
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
