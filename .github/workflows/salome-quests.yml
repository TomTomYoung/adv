name: Validate Salome access and library quests in Chromium
on:
  pull_request:
    paths:
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'data/scenario-editions.json'
      - 'tools/browser-salome-smoke.mjs'
      - 'tools/browser-hourglass-cast-smoke.mjs'
      - 'tools/hourglass-art-fixtures.mjs'
      - 'tests/fixtures/e2-q042-before-cast.json'
      - 'tools/browser-borrower-cast-smoke.mjs'
      - 'tools/borrower-art-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tests/fixtures/e2-q041-before-cast.json'
      - 'tools/browser-settlement-checkpoint.mjs'
      - 'assets/images/locations/**'
      - 'data/assets.json'
      - '.github/workflows/salome-quests.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  salome-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: salome-browser
      - name: Install browser and Japanese fonts
        if: steps.ci.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          # The pinned Playwright image includes Japanese font dependencies.
          test -n "$(fc-list :lang=ja)"
      - name: Walk to Salome, complete personal and regional library quests, and return in both layouts and widths
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-salome-smoke.mjs
      - name: Keep Salome viewport checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salome-browser-checkpoints
          path: /tmp/adv-salome-browser
          if-no-files-found: ignore
      - name: Check q041 borrower and clerk casts, return routes, and old saves
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-borrower-cast-smoke.mjs
      - name: Keep q041 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q041-cast-checkpoints
          path: /tmp/adv-library-art-browser
          if-no-files-found: ignore
      - name: Check q042 hourglass casts, shift timing, and old saves
        if: steps.ci.outputs.run == 'true'
        run: ADV_BROWSER_OUTPUT=/tmp/adv-hourglass-art-browser node tools/browser-hourglass-cast-smoke.mjs
      - name: Keep q042 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q042-cast-checkpoints
          path: /tmp/adv-hourglass-art-browser
          if-no-files-found: ignore
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
