name: Validate Salome access and library quests in Chromium
on:
  pull_request:
    paths:
      - '.github/actions/ubuntu-apt-mirrors/**'
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'data/scenario-editions.json'
      - 'tools/browser-salome-smoke.mjs'
      - 'tools/browser-settlement-checkpoint.mjs'
      - 'assets/images/locations/**'
      - 'data/assets.json'
      - '.github/workflows/salome-quests.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  salome-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: salome-browser
      - name: Prepare Ubuntu package mirrors
        if: steps.ci.outputs.run == 'true'
        uses: ./.github/actions/ubuntu-apt-mirrors
      - name: Install browser and Japanese fonts
        if: steps.ci.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium --only-shell
          # Playwright's Linux dependencies include IPA Gothic for Japanese.
          test -n "$(fc-list :lang=ja)"
      - name: Walk to Salome, complete personal and regional library quests, and return in both layouts and widths
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-salome-smoke.mjs
      - name: Keep Salome viewport checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salome-browser-checkpoints
          path: /tmp/adv-salome-browser
          if-no-files-found: ignore
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
