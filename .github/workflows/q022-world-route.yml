name: Validate q022 green-sleep routes in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/story-q022.mjs'
      - 'tools/build-scenario-editions.mjs'
      - 'tools/build-q022-world-route.mjs'
      - 'tools/build-companion-edition.mjs'
      - 'tools/preserved-world-quest.mjs'
      - 'tools/browser-q022-world-route-smoke.mjs'
      - 'tools/q022-world-route-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tools/measure-green-sleep.mjs'
      - 'playtests/quest-parties.json'
      - 'tests/q022-*.mjs'
      - '.github/workflows/q022-world-route.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  q022-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver and Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          test -n "$(fc-list :lang=ja)"
      - name: Measure six paths and two starting points with three parties at levels 3 and 4
        run: |
          mkdir -p /tmp/adv-green-sleep-art-browser
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {measureGreenSleep} from './tools/measure-green-sleep.mjs';
          const results=measureGreenSleep({levels:[3,4],starts:['site','reception']});
          fs.writeFileSync('/tmp/adv-green-sleep-art-browser/normal-trials.json',JSON.stringify(results,null,2));
          assert.equal(results.length,72);
          assert.ok(results.every(r=>r.status==='cleared'&&r.records.losses===0&&r.rescues===0));
          console.log(JSON.stringify({trials:results.length,failures:0,steps:[Math.min(...results.map(r=>r.steps)),Math.max(...results.map(r=>r.steps))]}));
          JS
      - name: Verify bedside cast, stretcher custody, old saves, Scene and Classic widths
        run: ADV_BROWSER_OUTPUT=/tmp/adv-green-sleep-art-browser node tools/browser-q022-world-route-smoke.mjs
      - name: Upload q022 trial checkpoints and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q022-world-route-checkpoints
          path: /tmp/adv-green-sleep-art-browser
          if-no-files-found: error
          retention-days: 7
