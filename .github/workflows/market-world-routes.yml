name: Validate market q052–q055 in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/market-world.mjs'
      - 'authoring/editions/e2/story-q05[2-5].mjs'
      - 'authoring/*story-kit.mjs'
      - 'tools/*market-world*.mjs'
      - 'tools/preserved-world-quest.mjs'
      - 'tools/character-art-browser.mjs'
      - 'playtests/quest-parties.json'
      - 'tests/*market-world*.mjs'
      - 'tests/helpers.mjs'
      - '.github/workflows/market-world-routes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        quest: [q052, q053, q054, q055]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2 && test -n "$(fc-list :lang=ja)"
      - run: node tools/browser-market-world-routes.mjs ${{ matrix.quest }}
        env:
          ADV_BROWSER_OUTPUT: /tmp/market-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.quest }}-market-checkpoints
          path: /tmp/market-browser
          retention-days: 7
  trials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/measure-market-world-routes.mjs > /tmp/normal-trials.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-normal-trials
          path: /tmp/normal-trials.json
          retention-days: 7
