name: q074 isolated validation
on:
  push:
    branches: [feature/machine-q074-cast]
    paths: [.github/workflows/q074-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q074-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locally tested sources
        run: |
          sha256sum --check <<'HASHES'
          79f9533e9fe1e9c48525019b03670847aa93b6ba259e9ab79c9290097f883db4  tools/apply-q074-work.mjs
          d0b4570f27727421cbb07397074d0da4a926fa575391df4800128328ed655ca2  tools/record-q074-work.mjs
          59b751e2622dd6689d360d5d85ac70609e35cb5d8b8293c0fe90f48900703195  tools/prayer-order-art-fixtures.mjs
          0c40653f9e5e03ea31f8454b9d1a38199a25e9a2ad658e8a42c72eb1afc782e4  tools/measure-prayer-order.mjs
          59175a029d445c2355085eed020158b560f51c5f02dd24ebfb253423f8547025  tools/browser-prayer-order-cast-smoke.mjs
          0556e041008530c94eff1370c4bc5d912ba93716b15e6759a81f4a449d68cc1e  tests/prayer-order-cast.test.mjs
          HASHES
      - name: Apply source-checked cast migration and preserve previous quest
        run: node tools/apply-q074-work.mjs
      - name: Verify all routes, save phases, battle recovery and existing machine regressions
        run: node --test tests/prayer-order-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/machine.test.mjs
      - name: Reproduce nine normal party routes and record verified results
        run: |
          node tools/measure-prayer-order.mjs doc/development/Q074_PLAYTEST_RESULTS.json
          node tools/record-q074-work.mjs
      - name: Generate snapshot and runtime while preserving authored documents
        run: |
          cp -a doc "$RUNNER_TEMP/q074-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q074-authored-docs/$file" "doc/$file"
          done
          node tools/build-runtime.mjs
      - name: Validate generation, distribution hashes, data, static references and documentation
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git rm tools/apply-q074-work.mjs tools/record-q074-work.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q074): fixed Yua cast, atomic save migration and prayer-order verification"
          git push origin HEAD:feature/machine-q074-cast
