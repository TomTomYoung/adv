name: q076 isolated validation
on:
  push:
    branches: [feature/machine-q076-audit]
    paths: [.github/workflows/q076-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q076-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locally tested source bytes
        run: |
          sha256sum -c <<'HASHES'
          9d984ea041c82d9d18c218379d8d04f5c6caaa09ac17192fd5ba1007d9f43e58  tools/iron-lullaby-art-fixtures.mjs
          724dd720f0dfce85b90e4602c1bb34c52a272cdb91cef2e6993049d12cb32e02  tests/iron-lullaby.test.mjs
          2fb812baba6e5313e2f190a8834c5cd7a668dfaa93299aaea51fe0e0cfd40f27  tools/measure-iron-lullaby.mjs
          350f84b19a3c9e9cbe2431531008d6a24ac043e32c5f45c93fd085fa511269dc  tools/browser-iron-lullaby-smoke.mjs
          0ea4a67d30bb483dec68d765e0caae32972895668f91dd0526df6e7df389da0a  tools/apply-q076-work.mjs
          HASHES
      - name: Apply checked source and retain previous definition
        run: node tools/apply-q076-work.mjs
      - name: Check all routes, save phases, interruptions and machine regressions
        run: node --test tests/iron-lullaby.test.mjs tests/relocated-cast-audit.test.mjs tests/machine.test.mjs
      - name: Reproduce six normal party trials and record results
        run: |
          node tools/measure-iron-lullaby.mjs doc/development/Q076_PLAYTEST_RESULTS.json
          node tools/apply-q076-work.mjs --record
      - name: Generate snapshot and runtime while preserving authored documents
        run: |
          cp -a doc "$RUNNER_TEMP/q076-authored-docs"
          node tools/build-scenario-editions.mjs
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q076-authored-docs/$file" "doc/$file"
          done
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
      - name: Validate generated data, assets, static references and documentation
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git rm tools/apply-q076-work.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q076): audit empty scenes and align medicine and recording timing"
          git push origin HEAD:feature/machine-q076-audit
