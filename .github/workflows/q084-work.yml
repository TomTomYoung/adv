name: q084 isolated validation
on:
  push:
    branches: [feature/observatory-q084-cast]
    paths: [.github/workflows/q084-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/observatory-q084-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original files and locally tested source bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const hashes={
           'authoring/editions/e2/oddland/observatory-first.mjs':'b8e1ec95d964a455abb0dff0247ed8502e05608b90d7fed234e7b8422164ec7e',
           'tools/build-observatory-quests.mjs':'b740a4c9021a25f5cda18339091f74d1e48286b393ae273c7577320f65f9a65b',
           'authoring/relocated-character-art.mjs':'e884c6a00961eb67b3db6909fe55303dafdc7fdfa3265f821164d289ed16d189',
           'authoring/relocated-cast-review.mjs':'1ebcd89e9c1e0adcdf0146a9ac10200330f1e97f36207848a92cba0369f11125',
           'tests/relocated-cast-audit.test.mjs':'195b3cb0d0c00df40fe608c2713b97ca5ae2140b06c5a8ec2c41b9c117106270',
           'data/scenario-editions/e2/q084.json':'5a137b72938df730044a51f489a149872370c2d28067e28932712ee8d50c41a2',
           'tools/q084-transfer/apply.mjs':'0b9fdc2f8b06080a6770faf060e79ee554f69495fab28a4a82ccaccc29cde779',
           'tools/q084-transfer/record.mjs':'c9062a464840db6dfd1fe741789fc6533ad2d6d96f82393f768f04941d7170dd',
           'tests/return-signal-cast.test.mjs':'735f28e22182d18db73ffc5cbc3d11ecd89fca43a5705398b1e0a5411f7a1110',
           'tools/return-signal-art-fixtures.mjs':'c00b87ee4d7f169a768d70abc4a3266cf0192a35793b6bc8df434a98862a8ba5',
           'tools/measure-return-signal.mjs':'40b7308d8afa3c8d427a48e06c89819f43c4e58c9b6b7d3699eca2be1643d336',
           'tools/browser-return-signal-cast-smoke.mjs':'0f9098197d5726a62bd47e0f263a1dd11d28747f45baffef78e475187d7dd7e9',
           '.github/workflows/q084-cast.yml':'de596a5412891a148953a4a721b1c268d0cc3cdc859882453a9cb3d4f1946c10'
          };
          for(const [p,h] of Object.entries(hashes))assert.equal(createHash('sha256').update(fs.readFileSync(p)).digest('hex'),h,p);
          console.log('Verified six originals and seven locally tested sources.');
          JS
      - name: Apply audited cast and preserve exact previous quest
        run: node tools/q084-transfer/apply.mjs
      - name: Check all routes, chart conditions, save phases, custody and interruption recovery
        run: node --test tests/return-signal-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/observatory*.test.mjs
      - name: Reproduce four ordinary party trials
        run: node tools/measure-return-signal.mjs doc/development/Q084_PLAYTEST_RESULTS.json
      - name: Generate documents and runtime while preserving authored records
        run: |
          node tools/build-docs.mjs
          git restore -- doc/battle/QUEST_PARTY_PLAYTEST.md doc/battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md doc/development/CHROMIUM_DEFERRED_2026-11-04.md doc/development/PROGRESS.md doc/development/REMAINING_WORK.md doc/development/TEST_OVERVIEW.md doc/dungeons/ODDLAND_RELOCATION_AUDIT.md doc/dungeons/REGIONAL_RELOCATION_WORK.md doc/scenarios/EGG_KNIGHT_FORESHADOWING.md doc/scenarios/ODDLAND_100_QUEST_DESIGN.md doc/scenarios/REGIONAL_QUEST_ALLOCATION.md doc/scenarios/SALOME_100_QUEST_DESIGN.md doc/ui/SOUND_AND_EFFECT_FORMAT.md
          node tools/q084-transfer/record.mjs
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm -r tools/q084-transfer
      - name: Validate generated content, assets, references and documentation
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-config-editors.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q084): distinguish real survivors, rescue escorts and transmitter delivery"
          git push origin HEAD:feature/observatory-q084-cast
