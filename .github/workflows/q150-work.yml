name: q150 isolated validation
on:
  push:
    branches: [feature/library-q150-cast]
    paths: [.github/workflows/q150-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-q150-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-checked authoring and preserve previous quest
        run: node tools/apply-q150-work.mjs
      - name: Verify current, previous and accepted saves and all 94 routes
        run: node --test tests/troupe-apprentice-cast.test.mjs tests/relocated-cast-audit.test.mjs
      - name: Reproduce seven normal party trials
        run: node tools/measure-troupe-apprentice.mjs doc/development/Q150_PLAYTEST_RESULTS.json
      - name: Generate docs and distribution hashes while retaining authored records
        run: |
          cp -a doc "$RUNNER_TEMP/q150-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q150-authored-docs/$file" "doc/$file"
          done
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm tools/apply-q150-work.mjs
      - name: Validate generated content, assets, static references and docs
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q150): four-person cast, consent and custody verification"
          git push origin HEAD:feature/library-q150-cast
