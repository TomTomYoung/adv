name: q083 isolated validation
on:
  push:
    branches: [feature/observatory-q083-audit]
    paths: [.github/workflows/q083-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/observatory-q083-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original files and exact locally tested source bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const hashes={
           'authoring/editions/e2/oddland/observatory-first.mjs':'45e15e81a9d9ff945a4de48d7f5afc222a71f85b1d1f48c88f5619ddf2341a6c',
           'tools/build-observatory-quests.mjs':'023787ab0cc613bb4bbf0478f35e6068e2097a59ef4ea2e8bc60fefb441dba25',
           'authoring/relocated-character-art.mjs':'d353fe1bff249c3e6e839a2c8da94f49dea54fd26c1f8dff46dfc1b56bdb9034',
           'authoring/relocated-cast-review.mjs':'918fe25faa47877c169bd31ea6b882079179ab2cd18a08b94d2c90a6e6cbb1a5',
           'tests/relocated-cast-audit.test.mjs':'0d3c1008e432ddf007604a62c94d880fb12ede0226b369fa8009b13213cfdbce',
           'data/scenario-editions/e2/q083.json':'a2e15ab7e9aafee8d32362a343d5b7734083d3507087fb1461344a269978f381',
           'tests/underground-eclipse-cast.test.mjs':'5574a20c15c70a11cbd3cc748a0a468e815fbe507597419b1061f15c5a043144',
           'tools/underground-eclipse-art-fixtures.mjs':'d83940dee596d98c95486a3e2c49837bf28f9d5a6319771c2c9cf3a55f665db3',
           'tools/measure-underground-eclipse.mjs':'3c1b6dd8d2d265975f7999628bf6b233a8e47d6526a48d17c69b483fd081840f',
           'tools/browser-underground-eclipse-cast-smoke.mjs':'923072c5a93c56ac2a8e12780e0dce68f9bd2b455a71a481c0392cb37f60dc8f',
           'tools/q083-transfer/apply.mjs':'d492fd7da64043ffc57920df0f48525811181d84e5c16c300a96ed0551fdf312',
           'tools/q083-transfer/record.mjs':'6d1214dccbfb38945b1b8dbe1b34efa699d7b37b84f71f2b1300d4179645a383',
           '.github/workflows/q083-cast.yml':'d35a7f3c651882c0a6b48928cc0c32a56c9d451f81ac6700f6c9917918289aed'
          };
          for(const [p,h] of Object.entries(hashes))assert.equal(createHash('sha256').update(fs.readFileSync(p)).digest('hex'),h,p);
          console.log('Original files and tested source bytes verified. Unused transport draft is not executed.');
          JS
      - name: Apply audited cast and preserve exact previous quest
        run: node tools/q083-transfer/apply.mjs
      - name: Validate paths, save phases, interruptions and observatory regressions
        run: node --test tests/underground-eclipse-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/observatory*.test.mjs
      - name: Reproduce five ordinary party trials
        run: node tools/measure-underground-eclipse.mjs doc/development/Q083_PLAYTEST_RESULTS.json
      - name: Generate documents and runtime while preserving authored records
        run: |
          node tools/build-docs.mjs
          git restore -- doc/battle/QUEST_PARTY_PLAYTEST.md doc/battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md doc/development/CHROMIUM_DEFERRED_2026-11-04.md doc/development/PROGRESS.md doc/development/REMAINING_WORK.md doc/development/TEST_OVERVIEW.md doc/dungeons/ODDLAND_RELOCATION_AUDIT.md doc/dungeons/REGIONAL_RELOCATION_WORK.md doc/scenarios/EGG_KNIGHT_FORESHADOWING.md doc/scenarios/ODDLAND_100_QUEST_DESIGN.md doc/scenarios/REGIONAL_QUEST_ALLOCATION.md doc/scenarios/SALOME_100_QUEST_DESIGN.md doc/ui/SOUND_AND_EFFECT_FORMAT.md
          node tools/q083-transfer/record.mjs
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm -r tools/q083-transfer
      - name: Validate generated content, assets, references and documentation
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-config-editors.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q083): fixed cast, compatible saves and separated eclipse resolutions"
          git push origin HEAD:feature/observatory-q083-audit
