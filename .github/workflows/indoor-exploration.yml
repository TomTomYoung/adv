name: Validate indoor exploration in Chromium
on:
  pull_request:
    paths:
      - '.github/actions/ubuntu-apt-mirrors/**'
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'tools/browser-indoor-smoke.mjs'
      - '.github/workflows/indoor-exploration.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  indoor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: indoor-browser
      - name: Prepare Ubuntu package mirrors
        if: steps.ci.outputs.run == 'true'
        uses: ./.github/actions/ubuntu-apt-mirrors
      - name: Install browser and Japanese fonts
        if: steps.ci.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium --only-shell
          test -n "$(fc-list :lang=ja)"
      - name: Check every enclosed map and water transition in both layouts and widths
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-indoor-smoke.mjs
      - name: Keep indoor viewport checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indoor-browser-checkpoints
          path: /tmp/adv-indoor-browser
          if-no-files-found: ignore
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
