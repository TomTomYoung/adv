name: q073 isolated validation
on:
  push:
    branches: [feature/machine-q073-cast]
    paths: [.github/workflows/q073-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q073-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct next quest title against distributed source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const title=JSON.parse(fs.readFileSync('data/scenario-editions/e2/q074.json','utf8')).title;
          assert.equal(title,'祈祷の順番');
          for(const p of ['authoring/relocated-cast-review.mjs','doc/HANDOFF.md','doc/CURRENT_STATUS.md','doc/development/PROGRESS.md','doc/development/REMAINING_WORK.md','doc/development/TEST_OVERVIEW.md']){
            const s=fs.readFileSync(p,'utf8'),old='q074「祈祷書の誤植」';
            assert.equal(s.split(old).length,2,p);
            fs.writeFileSync(p,s.replace(old,'q074「'+title+'」'));
          }
          JS
          node tools/audit-relocated-cast.mjs
          node --test tests/relocated-cast-audit.test.mjs
          node tools/check-docs.mjs
      - name: Commit verified editorial correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: use canonical q074 title in q073 handoff and audit"
          git push origin HEAD:feature/machine-q073-cast
