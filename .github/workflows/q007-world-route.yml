name: Validate q007 voice-wall routes in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/story-q007.mjs'
      - 'tools/build-q007-world-route.mjs'
      - 'tools/browser-q007-world-route-smoke.mjs'
      - 'tools/q007-world-route-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tools/measure-voice-wall.mjs'
      - 'tests/q007-*.mjs'
      - 'tests/fixtures/e2-q007-before-world.json'
      - 'assets/images/**'
      - '.github/workflows/q007-world-route.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  q007-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver and verify Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          test -n "$(fc-list :lang=ja)"
      - name: Exercise all six routes from reception and site with three level-one parties
        run: node --input-type=module -e "import {measureVoiceWall} from './tools/measure-voice-wall.mjs'; const r=measureVoiceWall(); console.log(JSON.stringify({trials:r.length,losses:r.reduce((n,x)=>n+x.records.losses,0)}));"
      - name: Check routes, remote voices, letters, consent, rescue and accepted saves
        run: ADV_BROWSER_OUTPUT=/tmp/adv-voice-wall-art-browser node tools/browser-q007-world-route-smoke.mjs
      - name: Keep q007 checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q007-world-route-checkpoints
          path: /tmp/adv-voice-wall-art-browser
          if-no-files-found: error
          retention-days: 7
