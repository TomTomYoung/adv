name: Validate q008 floating-coffin routes in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/story-q008.mjs'
      - 'tools/build-q008-world-route.mjs'
      - 'tools/browser-q008-world-route-smoke.mjs'
      - 'tools/q008-world-route-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tools/measure-floating-coffin.mjs'
      - 'playtests/quest-parties.json'
      - 'tests/q008-*.mjs'
      - 'tests/fixtures/e2-q008-before-world.json'
      - 'assets/images/**'
      - '.github/workflows/q008-world-route.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  q008-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver and verify Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          test -n "$(fc-list :lang=ja)"
      - name: Measure all three endings with three parties at levels one through six
        run: |
          mkdir -p /tmp/adv-floating-coffin-art-browser
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {measureFloatingCoffin} from './tools/measure-floating-coffin.mjs';
          const results=measureFloatingCoffin({levels:[1,2,3,4,5,6]});
          fs.writeFileSync('/tmp/adv-floating-coffin-art-browser/normal-trials.json',JSON.stringify(results,null,2));
          const recommended=results.filter(r=>r.level>=4);
          assert.equal(recommended.length,27);
          assert.ok(recommended.every(r=>r.status==='cleared'&&r.rescues===0&&r.records.losses===0));
          console.log(JSON.stringify({trials:results.length,recommended:recommended.length,lowLevelDefeats:results.filter(r=>r.status==='defeated').length}));
          JS
      - name: Check routes, casting, shortages, rescue and accepted saves
        run: ADV_BROWSER_OUTPUT=/tmp/adv-floating-coffin-art-browser node tools/browser-q008-world-route-smoke.mjs
      - name: Keep q008 checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q008-world-route-checkpoints
          path: /tmp/adv-floating-coffin-art-browser
          if-no-files-found: error
          retention-days: 7
