name: Validate cast presentation in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/characters.json'
      - 'data/assets.json'
      - 'assets/images/characters/**'
      - 'authoring/kagaribi-character-art.mjs'
      - 'authoring/oddland-character-art.mjs'
      - 'authoring/relocated-character-art.mjs'
      - 'authoring/editions/e2/oddland/chapel.mjs'
      - 'authoring/editions/e2/oddland/chapel-second.mjs'
      - 'data/scenario-editions/e2/q032.json'
      - 'data/scenario-editions/e2/q033.json'
      - 'data/scenario-editions/e2/q034.json'
      - 'data/scenario-editions/e2/q035.json'
      - 'data/scenario-editions/e2/q036.json'
      - 'data/scenario-editions/e2/q037.json'
      - 'data/scenario-editions/e2/q038.json'
      - 'data/scenario-editions/e2/q039.json'
      - 'data/scenario-editions/e2/q040.json'
      - 'data/scenario-editions/e2/q131.json'
      - 'data/scenario-editions/e2/q132.json'
      - 'data/scenario-editions/e2/q133.json'
      - 'data/scenario-editions/e2/q134.json'
      - 'data/scenario-editions/e2/q136.json'
      - 'data/scenario-editions/e2/q137.json'
      - 'data/scenario-editions/e2/q138.json'
      - 'data/scenario-editions/e2/q139.json'
      - 'data/scenario-editions/e2/q140.json'
      - 'tools/compile-relocated-quest.mjs'
      - 'tools/build-chapel-quests.mjs'
      - 'tools/chapel-art-fixtures.mjs'
      - 'tools/pilgrim-art-fixtures.mjs'
      - 'tools/receipt-art-fixtures.mjs'
      - 'tools/alms-art-fixtures.mjs'
      - 'tools/choir-art-fixtures.mjs'
      - 'tools/confession-art-fixtures.mjs'
      - 'tools/water-art-fixtures.mjs'
      - 'tools/mask-art-fixtures.mjs'
      - 'tools/mirror-art-fixtures.mjs'
      - 'tools/sand-art-fixtures.mjs'
      - 'tools/treasury-art-fixtures.mjs'
      - 'tools/stair-art-fixtures.mjs'
      - 'tools/vault-art-fixtures.mjs'
      - 'tools/breakfast-art-fixtures.mjs'
      - 'tools/door-art-fixtures.mjs'
      - 'tools/burnt-library-art-fixtures.mjs'
      - 'tools/explorer-art-fixtures.mjs'
      - 'tools/rescue-art-fixtures.mjs'
      - 'tools/maintenance-art-fixtures.mjs'
      - 'tools/browser-chapel-art-smoke.mjs'
      - 'authoring/editions/e2/oddland/sunken-first.mjs'
      - 'data/scenario-editions/e2/q061.json'
      - 'data/scenario-editions/e2/q062.json'
      - 'tools/build-sunken-quests.mjs'
      - 'tools/sunken-art-fixtures.mjs'
      - 'tools/heirs-art-fixtures.mjs'
      - 'tools/browser-sunken-art-smoke.mjs'
      - 'tests/fixtures/e2-q061-before-cast.json'
      - 'tests/fixtures/e2-q062-before-cast.json'
      - 'data/scenario-editions/e2/oddland-first-ten.json'
      - 'tools/character-art-browser.mjs'
      - 'tools/oddland-art-fixtures.mjs'
      - 'tools/browser-oddland-art-smoke.mjs'
      - 'tools/browser-cast-smoke.mjs'
      - 'tools/browser-kagaribi-art-smoke.mjs'
      - 'tools/kagaribi-art-fixtures.mjs'
      - '.github/workflows/cast-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast-browser:
    # Match the pinned Playwright release; ubuntu-latest may move ahead of its supported OSes.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium --only-shell
          test -n "$(fc-list :lang=ja)"
      - name: Verify native cast animations and script waits
        run: node tools/browser-cast-smoke.mjs
      - name: Verify Kagaribi character art in both editions, layouts and widths
        run: node tools/browser-kagaribi-art-smoke.mjs
      - name: Verify Oddland character art in both layouts and widths
        run: node tools/browser-oddland-art-smoke.mjs
      - name: Verify chapel cast and migrated saves in both layouts and widths
        run: node tools/browser-chapel-art-smoke.mjs
      - name: Verify sunken castle cast and migrated saves in both layouts and widths
        run: node tools/browser-sunken-art-smoke.mjs
      - name: Keep animation checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cast-presentation-checkpoints
          path: |
            /tmp/adv-cast-browser
            /tmp/adv-kagaribi-art-browser
            /tmp/adv-oddland-art-browser
          if-no-files-found: ignore
      # Keep each archive below the 512 MiB download limit as reviewed quests grow.
      - name: Keep chapel Scene checkpoints and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapel-scene-checkpoints
          path: |
            /tmp/adv-chapel-art-browser/*-scene-*.png
            /tmp/adv-chapel-art-browser/*.json
            /tmp/adv-chapel-art-browser/overlapping-group-labels.png
          if-no-files-found: ignore
      - name: Keep chapel Classic checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapel-classic-checkpoints
          path: /tmp/adv-chapel-art-browser/*-classic-*.png
          if-no-files-found: ignore
      - name: Keep sunken castle checkpoints and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunken-cast-checkpoints
          path: /tmp/adv-sunken-art-browser
          if-no-files-found: ignore
