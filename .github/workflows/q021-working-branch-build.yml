name: q021 deterministic edition generator and route tests
on:
  push:
    branches:
      - codex/q021-seed-bird-world-route-20261119
    paths:
      - .github/workflows/q021-working-branch-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/q021-seed-bird-world-route-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate unchanged old edition and new q021 outputs
        run: npm run build:editions
      - name: Verify reproducibility and physical graph
        run: |
          npm run check:editions
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const q=JSON.parse(fs.readFileSync('data/scenario-editions/e2/q021.json'));
          assert.equal(q.id,'q021');
          assert.ok(Object.keys(q.story.scenes).length>=18);
          assert.ok(Object.keys(q.story.worldPlaces).length>=5);
          assert.equal(q.outcomes.contract.gold,101);
          assert.equal(q.outcomes.informed.xp,84);
          console.log(JSON.stringify({scenes:Object.keys(q.story.scenes).length,actions:Object.keys(q.story.actions).length,journeys:Object.values(q.story.actions).filter(a=>a.journey).length}));
          JS
      - name: Test original seven paths, lost fights, rescue, custody and accepted saves
        run: node --test tests/q021-world-route.test.mjs tests/q021-legacy-route.test.mjs
      - name: Commit only deterministic q021 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scenario-editions/e2/q021.json data/scenario-editions/e2/companions.json data/scenario-editions.json doc/development/DATA_SNAPSHOT.json runtime.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(q021): regenerate deterministic edition outputs'
            git push origin HEAD:codex/q021-seed-bird-world-route-20261119
          fi
