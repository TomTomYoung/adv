name: Verify deployed q028 gardeners seat routes
on:
  push:
    branches: [codex/verify-gardeners-seat-pages]
    paths: ['.github/workflows/q028-published-trial.yml']
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb6daa8cae1796969ed742c604c9c6bc9209021f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify release files and play all seven routes on the published mobile page
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          import {data,catalog,routes,drain,arrive,fight} from './tests/q028-helpers.mjs';
          import {createQuestTrial,questTrialReport} from './src/application/quest-playtest.js';
          const base='https://tomtomyoung.github.io/adv/';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          for(const path of ['runtime.json','data/scenario-editions.json','data/scenario-editions/e2/q028.json','data/scenario-editions/e2/geography.json','data/scenario-editions/e2/companions.json','data/quests/q028.json','playtests/quest-parties.json']){
            const expected=hash(await readFile(path));let actual;
            for(let n=0;n<24;n++){
              const response=await fetch(base+path+'?revision=eb6daa8cae1796969ed742c604c9c6bc9209021f&attempt='+n);
              if(response.ok)actual=hash(Buffer.from(await response.arrayBuffer()));
              if(actual===expected)break;
              await new Promise(r=>setTimeout(r,5000));
            }
            assert.equal(actual,expected,path);console.log('VERIFIED',path,actual);
          }
          function commandsFor(route){
            const t=createQuestTrial(data,catalog,{quest:'q028',party:'balanced',level:3,start:'site',outcome:route.outcome,battleMode:'classic',seed:1907}),g=t.engine,commands=[];
            const dispatch=g.dispatch.bind(g);
            g.dispatch=intent=>{const ok=dispatch(intent);if(ok)commands.push(intent);return ok};
            drain(g);
            for(const id of route.path){
              assert.ok(g.dispatch({type:'choose',id}));drain(g);
              if(g.state.battle)fight(g);
              if(g.state.journey)arrive(g,{maintain:true});
            }
            const report=questTrialReport(t);assert.equal(report.status,'cleared');
            return {commands,report};
          }
          const browser=await chromium.launch({args:['--no-sandbox']});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[],q038=[],bad=[],failed=[];
            page.on('pageerror',err=>errors.push(err.message));
            page.on('requestfailed',req=>failed.push([req.url(),req.failure()?.errorText]));
            page.on('response',r=>{
              if(r.status()>=400)bad.push([r.status(),r.url()]);
              if(new URL(r.url()).pathname.endsWith('/e2/q038.json'))q038.push(r.status());
            });
            const url=base+'quest-party-playtest.html?edition=e2&quest=q028&party=balanced&level=3&start=site&outcome=informed&seed=1907&battleMode=classic';
            const navigation=await page.goto(url,{waitUntil:'domcontentloaded'});
            console.log('DOCUMENT',navigation.status(),await page.title());
            assert.equal(navigation.status(),200);
            try {
              await page.waitForFunction(()=>document.querySelector('#launch:enabled, #trial-status button'),{},{timeout:90000});
              if(await page.locator('#trial-status button').count()){
                console.log('RETRY_BUTTON',await page.locator('#trial-status').innerText(),bad);
                await page.locator('#trial-status button').click();
              }
              await page.locator('#launch:enabled').waitFor({timeout:90000});
            }catch(error){
              console.log('LOAD_DIAGNOSTICS',JSON.stringify({title:await page.title(),body:(await page.locator('body').innerText()).slice(0,600),errors,bad,failed}));
              throw error;
            }
            assert.ok(q038.includes(200),JSON.stringify(q038));console.log('LOADED',JSON.stringify({q038,bad,failed}));
            await page.selectOption('#effects','off');
            for(const route of routes){
              const {commands,report}=commandsFor(route);
              await page.selectOption('#outcome',route.outcome);
              await page.click('#launch');
              await page.waitForFunction(()=>window.questPlaytest?.trial?.engine?.state.quests.q028.stage==='active');
              for(const intent of commands){
                if(intent.type==='choose'){
                  const selector=await page.evaluate(id=>'#app [data-focus='+CSS.escape('choice:'+id)+']:visible',intent.id);
                  const button=page.locator(selector);
                  for(let n=0;n<25&&!await button.isVisible();n++)await page.locator('#app [data-focus="message:next"]:visible').click({timeout:7000});
                  await button.click({timeout:10000});
                }else{
                  if(intent.type==='advance'&&await page.evaluate(()=>questPlaytest.report().status==='cleared'))continue;
                  assert.ok(await page.evaluate(i=>questPlaytest.dispatch(i),intent),JSON.stringify(intent));
                }
              }
              const {out,v,known}=await page.evaluate(()=>({out:questPlaytest.report(),v:questPlaytest.trial.engine.state.stories.q028.values,known:questPlaytest.trial.engine.state.stories.q028.knowledge.party??[]}));
              assert.equal(out.status,'cleared');assert.equal(out.outcome,route.outcome);assert.equal(out.steps,report.steps);
              assert.deepEqual(out.gold,report.gold);assert.deepEqual(out.records,report.records);assert.equal(out.rescues,0);
              const rules=route.outcome==='contract',full=route.outcome==='informed',wet=full||route.scope==='water';
              assert.equal(v.scope,route.scope??'none');assert.equal(v.record,rules?'written':full?'both':'partial');
              assert.equal(v.warned,route.old.includes('cut'));assert.equal(v.corrected,route.old.includes('listen'));
              assert.equal(v.wet,wet);assert.equal(v.pruned,full);assert.equal(v.tagged,full);assert.equal(v.explained,full);assert.equal(v.sketch,full);
              assert.equal(v.knifeAt,rules?'box':wet?'middle':'tray');assert.equal(v.tagAt,rules?'box':full?'plant':wet?'last':'tray');
              assert.equal(v.jugAt,rules?'box':route.scope==='untouched'?'tray':'front');
              assert.equal(v.apprenticeAt,full?'desk':'seat');assert.equal(v.yuiAt,'desk');
              assert.deepEqual(errors,[]);
              console.log('PUBLIC_RESULT',JSON.stringify({path:route.old,outcome:out.outcome,steps:out.steps,scope:v.scope,corrected:v.corrected,wet:v.wet,pruned:v.pruned,tag:v.tagAt,record:v.record,losses:out.records.losses,rescues:out.rescues}));
            }
            let injected=0;const startCount=q038.length;
            await page.route(url=>url.pathname.endsWith('/e2/q038.json'),async route=>{
              injected++;
              if(injected===1)await route.fulfill({status:503,body:'Temporary outage'});
              else await route.continue();
            });
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('#launch:enabled').waitFor({timeout:120000});
            assert.ok(injected>=2);assert.ok(q038.slice(startCount).includes(200));
            assert.equal(await page.locator('#trial-status button').count(),0);
            assert.deepEqual(errors,[]);console.log('Q038_RECOVERY',JSON.stringify({firstResponse:503,observed:q038.slice(startCount),requests:injected,manualRetry:false}));
          }finally{await browser.close();}
          JS
