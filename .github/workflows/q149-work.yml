name: q149 isolated validation
on:
  push:
    branches: [feature/library-q149-cast]
    paths: [.github/workflows/q149-work.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source worktree
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          tar -czf "$RUNNER_TEMP/adv-source.tgz" --exclude='./.git' --exclude='./assets' .
      - uses: actions/upload-artifact@v4
        with:
          name: q149-source-worktree
          path: |
            ${{ runner.temp }}/adv-source.tgz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
