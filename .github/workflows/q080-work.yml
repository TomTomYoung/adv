name: q080 isolated validation
on:
  push:
    branches: [feature/machine-q080-cast]
    paths: [.github/workflows/q080-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/machine-q080-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locally tested source bytes
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected={"tools/q080-apply.mjs":"802ce4d071cfec0331e422f5e727c9cae5844ab81b47a95e9b6198946b0beaa9","tools/iron-inheritance-art-fixtures.mjs":"1c96b59894da566ff6225109abe621230351a58ff3cdec442a1c3a67708dfdf4","tests/iron-inheritance-cast.test.mjs":"839a3f4d5d63cf499475d5657f27b01d5ad3214b0cef03c3f902babff052955e","tools/measure-iron-inheritance.mjs":"6d1ada742aaff89b6128b880f5212adaf50bbe92fedb7210108a3f72d0f6f791","tools/browser-iron-inheritance-cast-smoke.mjs":"083e095d34c1f5e6655f830c3a0d1715bf2195f6f1b581d979d2e0d4f8c8f809",".github/workflows/q080-cast.yml":"c2c7281778dc0bbfe1195c8379ced2cd4bafd1ca5305fdc8671fdf3134174700","tools/q080-record.mjs":"659f632025920987eb3f02ba62a885a4a5eac5c3f7e196d40974239179ef29f8"};
          for(const [p,h] of Object.entries(expected)){
            const actual=createHash('sha256').update(fs.readFileSync(p)).digest('hex');
            if(actual!==h)throw Error('Transferred source differs: '+p+' '+actual);
          }
          console.log('Seven source files match locally verified bytes.');
          JS
      - name: Apply checked authoring and preserve previous definition
        run: node tools/q080-apply.mjs
      - name: Verify all signatures, save phases, key custody, battle recovery and regressions
        run: node --test tests/iron-inheritance-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/machine.test.mjs
      - name: Reproduce all 24 normal party trials
        run: node tools/measure-iron-inheritance.mjs doc/development/Q080_PLAYTEST_RESULTS.json
      - name: Generate documents and runtime while preserving authored records
        run: |
          cp -a doc "$RUNNER_TEMP/q080-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q080-authored-docs/$file" "doc/$file"
          done
          node tools/q080-record.mjs
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
      - name: Validate generated content, distribution, assets, references and documentation
        run: |
          node tools/build-scenario-editions.mjs --check
          node tools/build-runtime.mjs --check
          node tools/validate.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git rm tools/q080-apply.mjs tools/q080-record.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q080): fixed approval desks, signature phases and atomic save migration"
          git push origin HEAD:feature/machine-q080-cast
