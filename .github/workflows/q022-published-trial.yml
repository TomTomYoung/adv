name: Verify deployed q022 garden route
on:
  push:
    branches: [codex/verify-green-garden-pages-20261119]
    paths: ['.github/workflows/q022-published-trial.yml']
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5576c1b457de82f1e6c587a67b357d412f53407f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Compare seven published files and complete the public route on mobile
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const base='https://tomtomyoung.github.io/adv/';
          const paths=['runtime.json','data/scenario-editions.json','data/scenario-editions/e2/q022.json','data/scenario-editions/e2/geography.json','data/scenario-editions/e2/companions.json','data/quests/q022.json','playtests/quest-parties.json'];
          const hash=b=>createHash('sha256').update(b).digest('hex');
          for(const path of paths){
            const expected=hash(await readFile(path));
            let actual;
            for(let attempt=0;attempt<8;attempt++){
              const r=await fetch(base+path+'?revision=5576c1b457de82f1e6c587a67b357d412f53407f&attempt='+attempt);
              if(r.ok)actual=hash(Buffer.from(await r.arrayBuffer()));
              if(actual===expected)break;
              await new Promise(r=>setTimeout(r,5000));
            }
            assert.equal(actual,expected,path);
            console.log(path,actual);
          }
          const browser=await chromium.launch({args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.route(base+'**',async route=>{
              const url=route.request().url();
              let reason;
              for(let n=0;n<4;n++){
                try{
                  const response=await fetch(url,{signal:AbortSignal.timeout(18000)});
                  if(!response.ok)throw Error('HTTP '+response.status);
                  const body=Buffer.from(await response.arrayBuffer());
                  if(!body.length)throw Error('empty file');
                  await route.fulfill({status:200,contentType:response.headers.get('content-type')??'application/octet-stream',body});return;
                }catch(error){reason=error.message;await new Promise(ok=>setTimeout(ok,(n+1)*250));}
              }
              console.error('Failed published URL',url,reason);await route.abort();
            });
            await page.goto(base+'quest-party-playtest.html?edition=e2&quest=q022&party=balanced&level=3&start=site&outcome=informed&seed=1907&battleMode=classic',{waitUntil:'domcontentloaded'});
            try {await page.locator('#launch:enabled').waitFor({timeout:90000});} catch(error){console.log(await page.locator('#trial-status').innerText(),errors); throw error;}
            await page.selectOption('#effects','off');
            await page.click('#launch');
            await page.waitForFunction(()=>window.questPlaytest?.trial?.engine?.state.quests.q022.stage==='active');
            const trace=[{"type":"advance"},{"type":"choose","id":"dress"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"advance"},{"type":"choose","id":"clean"},{"type":"advance"},{"type":"choose","id":"bandage"},{"type":"advance"},{"type":"advance"},{"type":"choose","id":"observe"},{"type":"advance"},{"type":"advance"},{"type":"choose","id":"observe"},{"type":"advance"},{"type":"advance"},{"type":"choose","id":"awake"},{"type":"advance"},{"type":"choose","id":"escort"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"battle","action":"skill","skill":"attack","target":"enemy_0"},{"type":"battle","action":"skill","skill":"fire","target":"enemy_0"},{"type":"advance"},{"type":"advance"},{"type":"advance"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"move","direction":"forward"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"right"},{"type":"move","direction":"forward"},{"type":"player.command","id":"inspect"},{"type":"choose","id":"[\"target\",\"object:exit\"]"},{"type":"choose","id":"[\"action\",\"object:exit\",{\"type\":\"field.object\",\"id\":\"exit\"}]"},{"type":"advance"},{"type":"location.move","id":"hikarigaeri_medical"},{"type":"advance"},{"type":"choose","id":"finish"},{"type":"advance"}];
            const choices=[];
            for(const intent of trace){
              if(intent.type==='choose'){
                const button=page.locator('#app [data-focus="choice:'+intent.id+'"]:visible');
                for(let n=0;n<25 && !await button.isVisible();n++){
                  const next=page.locator('#app [data-focus="message:next"]:visible');
                  await next.click({timeout:7000});
                }
                await button.click({timeout:10000}); choices.push(intent.id);
              } else {
                const before=await page.evaluate(()=>({status:questPlaytest.report().status,scene:questPlaytest.trial.engine.state.stories.q022.scene,wait:questPlaytest.trial.engine.state.waiting?.type}));
                if(intent.type==='advance' && before.status==='cleared')continue;
                assert.equal(await page.evaluate(intent=>window.questPlaytest.dispatch(intent),intent),true,JSON.stringify({intent,before,choices}));
              }
            }
            const result=await page.evaluate(()=>({report:questPlaytest.report(),values:questPlaytest.trial.engine.state.stories.q022.values}));
            assert.equal(result.report.status,'cleared');
            assert.equal(result.report.outcome,'informed');
            assert.equal(result.report.gold.end,212);
            assert.equal(result.report.rescues,0);
            assert.equal(result.report.steps,22);
            assert.equal(result.report.records.wins,1);
            assert.equal(result.values.round,2);
            assert.equal(result.values.spontaneousAwake,true);
            assert.equal(result.values.patientOnStretcher,false);
            assert.equal(result.values.stretcherAt,'hana');
            assert.equal(result.values.patientAt,'clinic');
            assert.equal(result.values.hanaAt,'clinic');
            assert.equal(result.values.feverReturned,false);
            assert.deepEqual(errors,[]);
            console.log('PUBLIC_RESULT',JSON.stringify({choices,steps:result.report.steps,records:result.report.records,gold:result.report.gold,values:result.values,errors}));
          } finally {await browser.close();}
          JS
