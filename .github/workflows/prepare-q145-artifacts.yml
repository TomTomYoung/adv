name: Prepare q145 generated artifacts
on:
  push:
    branches:
      - feature/library-q145-cast
    paths:
      - .github/workflows/prepare-q145-artifacts.yml
      - authoring/editions/e2/salome/library-second.mjs
      - tests/garden-bloom-cast.test.mjs
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-q145-cast
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate quest and derived data
        run: npm run build:catalog
      - name: Pin the reviewed q145 fingerprint and regenerate cast audit
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {createHash} from 'node:crypto'; const q=JSON.parse(fs.readFileSync('data/scenario-editions/e2/q145.json','utf8')); const hash=createHash('sha256').update(JSON.stringify(q)).digest('hex'); const path='authoring/relocated-cast-review.mjs'; const source=fs.readFileSync(path,'utf8'); if(source.includes('Q145_FINGERPRINT_PENDING'))fs.writeFileSync(path,source.replace('Q145_FINGERPRINT_PENDING',hash)); else if(!source.includes(hash))throw Error('q145 source changed');"
          node tools/audit-relocated-cast.mjs
          npm run build:runtime
      - name: Commit only q145 generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/relocated-cast-review.mjs data/scenario-editions/e2/q145.json data/scenario-editions/e2/oddland-first-ten.json doc/scenarios/RELOCATED_CAST_AUDIT.json doc/scenarios/RELOCATED_CAST_AUDIT.md doc/development/DATA_SNAPSHOT.json runtime.json
          git restore .
          git diff --cached --quiet || git commit -m "build: generate q145 reviewed artifacts"
          git push
      - name: Run targeted q145 and cast audit tests
        run: node --test tests/garden-bloom-cast.test.mjs tests/relocated-cast-audit.test.mjs
