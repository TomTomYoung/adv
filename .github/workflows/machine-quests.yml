name: Validate machinery quests in Chromium
on:
  pull_request:
    paths:
      - 'tools/ci-scope.mjs'
      - '.github/actions/ci-plan/**'
      - '.github/actions/ci-record/**'
      - 'src/**'
      - 'data/scenario-editions/**'
      - 'data/scenario-editions.json'
      - 'tools/browser-machine-smoke.mjs'
      - 'tools/browser-machine-cast-smoke.mjs'
      - 'tools/night-soldier-art-fixtures.mjs'
      - 'tools/funeral-art-fixtures.mjs'
      - 'tools/hunter-art-fixtures.mjs'
      - 'tools/god-sandals-art-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tests/fixtures/e2-q173-before-cast.json'
      - 'tests/fixtures/e2-q174-before-cast.json'
      - 'tests/fixtures/e2-q175-before-cast.json'
      - 'tests/fixtures/e2-q176-before-cast.json'
      - '.github/workflows/machine-quests.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  machine-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select checks and reuse identical successful inputs
        id: ci
        uses: ./.github/actions/ci-plan
        with:
          suite: machine-browser
      - name: Install browser and Japanese fonts
        if: steps.ci.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium --only-shell
          sudo apt-get install -y fonts-noto-cjk
      - name: Walk the worker return, ward collection, and three homes in both layouts and widths
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-machine-smoke.mjs
      - name: Keep machinery viewport checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: machine-browser-checkpoints
          path: /tmp/adv-machine-browser
          if-no-files-found: ignore
      - name: Verify q173 cast, consent, and current and older saves
        if: steps.ci.outputs.run == 'true'
        run: node tools/browser-machine-cast-smoke.mjs
      - name: Keep q173 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q173-cast-checkpoints
          path: /tmp/adv-machine-art-browser
          if-no-files-found: ignore
      - name: Verify q174 procession, letter custody and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-funeral-art-browser
        run: node tools/browser-machine-cast-smoke.mjs --funeral-only
      - name: Keep q174 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q174-cast-checkpoints
          path: /tmp/adv-funeral-art-browser
          if-no-files-found: ignore
      - name: Verify q175 cast, combat recovery and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-hunter-art-browser
        run: node tools/browser-machine-cast-smoke.mjs --hunter-only
      - name: Keep q175 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q175-cast-checkpoints
          path: /tmp/adv-hunter-art-browser
          if-no-files-found: ignore
      - name: Verify q176 god, sandals and older saves
        if: steps.ci.outputs.run == 'true'
        env:
          ADV_BROWSER_OUTPUT: /tmp/adv-god-sandals-art-browser
        run: node tools/browser-machine-cast-smoke.mjs --god-sandals-only
      - name: Keep q176 cast checkpoints
        if: always() && steps.ci.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: q176-cast-checkpoints
          path: /tmp/adv-god-sandals-art-browser
          if-no-files-found: ignore
      - name: Remember successful inputs
        if: success() && steps.ci.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/ci-record
        with:
          key: ${{ steps.ci.outputs.key }}
          path: ${{ steps.ci.outputs.path }}
