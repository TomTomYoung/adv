name: q090 isolated validation
on:
  push:
    branches: [feature/observatory-q090-audit]
    paths: [.github/workflows/q090-work.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/observatory-q090-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locally tested source bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const test='tests/sky-return-cast.test.mjs';
          // Correct the identified transcription before checking original bytes.
          fs.writeFileSync(test,fs.readFileSync(test,'utf8').replace('loadQ090(f.save())','loadQ090(f.save)'));
          const expected={
           'tools/apply-q090-audit.mjs':'b34635ed810b1bfbed0c5a12310387392d0609df52c10c7e325a19655de99ddd',
           'tools/append-q090-record.mjs':'39cc945f9302d4a94da4d3192a91f4ed10ddfd69f638a96a1a6f81176b6ecc60',
           'tools/sky-return-art-fixtures.mjs':'fe12229ef20f5bd60f520b49393d120f0d2130e612237fc673cd2530ae8c0a1a',
           'tests/sky-return-cast.test.mjs':'2059c79f2ce43ba4b36cb029a4b72023ed9282fae6c0c48e6be4b2f509c57788',
           'tools/measure-sky-return.mjs':'8dc5848703bb9da9a180db2be62b98dda05f8582eb42f65381f36c91f00ea3ac',
           'tools/browser-sky-return-cast-smoke.mjs':'fe2de89fbbd4beb10d5fdcd116bbf4d8bf8edbf20fc9d2e09b90a4c31089efbd',
           '.github/workflows/q090-cast.yml':'847d088e07a5b0c6be6ead8484b908028c2e9025f186a14687e1507aebbfc921'
          };
          for(const [file,wanted] of Object.entries(expected)){const actual=createHash('sha256').update(fs.readFileSync(file)).digest('hex');console.log(file,actual);if(actual!==wanted)throw Error('Transferred source differs: '+file);}
          JS
      - name: Apply audited casts and preserve exact previous quest
        run: node tools/apply-q090-audit.mjs
      - name: Check all routes, power boundaries, battles, saves and observatory regressions
        run: node --test tests/sky-return-cast.test.mjs tests/relocated-cast-audit.test.mjs tests/observatory*.test.mjs
      - name: Reproduce five ordinary party trials
        run: node tools/measure-sky-return.mjs doc/development/Q090_PLAYTEST_RESULTS.json
      - name: Generate documents and runtime while preserving authored records
        run: |
          cp -a doc "$RUNNER_TEMP/q090-authored-docs"
          node tools/build-docs.mjs
          for file in battle/QUEST_PARTY_PLAYTEST.md battle/SALOME_CLASSES_AND_CHARACTERS_DESIGN.md development/CHROMIUM_DEFERRED_2026-11-04.md development/PROGRESS.md development/REMAINING_WORK.md development/TEST_OVERVIEW.md dungeons/ODDLAND_RELOCATION_AUDIT.md dungeons/REGIONAL_RELOCATION_WORK.md scenarios/EGG_KNIGHT_FORESHADOWING.md scenarios/ODDLAND_100_QUEST_DESIGN.md scenarios/REGIONAL_QUEST_ALLOCATION.md scenarios/SALOME_100_QUEST_DESIGN.md ui/SOUND_AND_EFFECT_FORMAT.md; do
            cp "$RUNNER_TEMP/q090-authored-docs/$file" "doc/$file"
          done
          node tools/append-q090-record.mjs
          node tools/audit-relocated-cast.mjs
          node tools/build-runtime.mjs
          git rm tools/apply-q090-audit.mjs tools/append-q090-record.mjs
      - name: Validate generated content, assets, references and documentation
        run: |
          node tools/build-runtime.mjs --check
          node tools/build-scenario-editions.mjs --check
          node tools/validate.mjs
          node tools/check-config-editors.mjs
          node tools/check-static.mjs
          node tools/check-docs.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(q090): finish cast audit and verify observation power boundaries"
          git push origin HEAD:feature/observatory-q090-audit
