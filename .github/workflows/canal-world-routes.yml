name: Validate q101–q110 canal quarter routes in Chromium
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'authoring/editions/e2/story-q10[1-9].mjs'
      - 'authoring/editions/e2/story-q110.mjs'
      - 'authoring/editions/e2/canal-quarter.mjs'
      - 'authoring/*story-kit.mjs'
      - 'tools/build-scenario-editions.mjs'
      - 'tools/build-canal-world-routes.mjs'
      - 'tools/build-companion-edition.mjs'
      - 'tools/preserved-world-quest.mjs'
      - 'tools/browser-canal-world-routes.mjs'
      - 'tools/world-route-browser-fixtures.mjs'
      - 'tools/character-art-browser.mjs'
      - 'tools/measure-world-routes.mjs'
      - 'tests/world-route-helpers.mjs'
      - 'tests/abyss-world-helpers.mjs'
      - 'tools/build-oddland-geography.mjs'
      - 'playtests/quest-parties.json'
      - 'tests/canal-world-*.mjs'
      - 'tests/q106-world-route.test.mjs'
      - 'tests/q107-world-route.test.mjs'
      - 'tests/q108-world-route.test.mjs'
      - 'tests/q109-world-route.test.mjs'
      - 'tests/q110-world-route.test.mjs'
      - 'authoring/editions/e2/hikarigaeri-districts.mjs'
      - 'tools/verify-published-saves.mjs'
      - 'tools/verify-market-published.mjs'
      - 'tests/helpers.mjs'
      - '.github/workflows/canal-world-routes.yml'
  push:
    branches: [master]
    paths:
      - 'data/scenario-editions/e2/q10[1-9].json'
      - 'data/scenario-editions/e2/q110.json'
      - 'tools/verify-published-saves.mjs'
      - 'tools/verify-market-published.mjs'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        quest: [q101, q102, q103, q104, q105, q106, q107, q108, q109, q110]
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver and Japanese fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          test -n "$(fc-list :lang=ja)"
      - name: Verify parties, saved scenes and original branches
        run: node tools/browser-canal-world-routes.mjs ${{ matrix.quest }}
        env:
          ADV_BROWSER_OUTPUT: /tmp/canal-browser
      - name: Exercise the release playthrough against this revision
        env:
          ADV_TRIAL_BASE_URL: http://127.0.0.1:8000/
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/abyss-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/verify-market-published.mjs --canal ${{ matrix.quest }}
      - name: Upload trial checkpoints and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.quest }}-canal-checkpoints
          path: /tmp/canal-browser
          if-no-files-found: error
          retention-days: 7

  published:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify the deployed files, canal playthroughs, pre-update saves and q038 retry
        run: node tools/verify-market-published.mjs --canal
