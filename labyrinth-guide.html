<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182a2a">
  <title>迷宮図鑑 | 灯帰りの迷宮</title>
  <link rel="stylesheet" href="src/view/labyrinth-guide.css">
</head>
<body>
  <header>
    <div class="wrap mast">
      <a class="home" href="index.html">灯帰りの迷宮</a>
      <h1>迷宮図鑑</h1>
    </div>
  </header>
  <main class="wrap">
    <nav aria-label="図鑑のページ">
      <a id="nav-allies" href="#allies">キャラ図鑑</a>
      <a id="nav-monsters" href="#monsters">魔物図鑑</a>
      <a id="nav-enemies" href="#enemies">魔物編成</a>
    </nav>
    <p id="status" role="status">図鑑を読み込んでいます…</p>
    <section id="allies" aria-labelledby="ally-title" hidden>
      <h2 id="ally-title" tabindex="-1">キャラ図鑑</h2>
      <a class="back-link" id="allies-back" href="#allies" hidden>キャラ一覧に戻る</a>
      <div class="controls">
        <label hidden>仲間<select id="actor"></select></label>
        <label hidden>育成職<select id="job"></select></label>
        <label>レベル<input id="level" type="number" min="1" value="1" step="1" inputmode="numeric"></label>
        <label>装備条件<select id="gear"></select></label>
      </div>
      <div id="ally-grid" class="guide-grid"></div>
      <div id="ally-detail" hidden>
        <div id="sheet"></div>
        <details id="levels">
          <summary>全レベルの成長一覧</summary>
          <div id="growth"></div>
        </details>
      </div>
    </section>
    <section id="monsters" aria-labelledby="monster-title" hidden>
      <h2 id="monster-title" tabindex="-1">魔物図鑑</h2>
      <nav class="monster-families" aria-label="魔物の種別">
        <a href="#monsters" data-family="">すべて</a>
        <a href="#monsters/goblin" data-family="goblin">ゴブリン</a>
        <a href="#monsters/orc" data-family="orc">オーク</a>
        <a href="#monsters/ogre" data-family="ogre">オーガ</a>
        <a href="#monsters/skeleton" data-family="skeleton">スケルトン</a>
        <a href="#monsters/slime" data-family="slime">スライム</a>
      </nav>
      <a class="back-link" id="monsters-back" href="#monsters" hidden>魔物一覧に戻る</a>
      <div class="controls">
        <label id="monster-search-label">名前で絞り込み<input id="monster-search" type="search" autocomplete="off"></label>
        <label hidden>魔物<select id="monster"></select></label>
      </div>
      <p class="note">能力と報酬は各魔物の基礎値です。千変の迷宮では階層と編成に応じて変わります。</p>
      <div id="monster-index"></div>
      <div id="monster-sheet" hidden></div>
    </section>
    <section id="enemies" aria-labelledby="enemy-title" hidden>
      <h2 id="enemy-title">魔物編成</h2>
      <div class="controls">
        <label>対象
          <select id="source">
            <option value="dungeon">千変の迷宮</option>
            <option value="common">全ダンジョン共通の候補</option>
          </select>
        </label>
        <label>レベル帯<select id="band"></select></label>
      </div>
      <p class="note" id="probability-note">出現率は、その階で通常戦闘が起きたときに各編成が選ばれる割合です。</p>
      <div id="groups"></div>
    </section>
  </main>
  <noscript>図鑑を表示するにはJavaScriptを有効にしてください。</noscript>
  <script type="module" src="src/labyrinth-guide.js"></script>
</body>
</html>
