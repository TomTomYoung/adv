<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ダンジョン生成テスト — 灯帰りの迷宮</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101a20;color:#e0e7e4;font:15px/1.55 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px}p{margin:8px 0}.panel{background:#17242b;border:1px solid #405158;border-radius:8px;padding:14px}.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls label{display:grid;gap:4px}.wide{grid-column:1/-1}input,select,button{font:inherit;color:inherit;background:#22343c;border:1px solid #66777e;border-radius:5px;padding:8px}button{cursor:pointer}button:hover{border-color:#e8c783}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}canvas{display:block;width:100%;min-height:420px;background:#091015;border:1px solid #405158;border-radius:6px;image-rendering:pixelated}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.legend span{display:inline-flex;align-items:center;gap:6px}.swatch{width:14px;height:14px;border:1px solid #82939a}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.stat{background:#0f1b21;border-radius:5px;padding:8px}.stat b{display:block;font-size:18px}#status{min-height:1.5em;color:#e8c783}.error{color:#ffb3aa!important}details{margin-top:14px}pre{white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;background:#091015;padding:10px;border-radius:5px}.note{color:#aebbc0;font-size:13px}@media(max-width:800px){main{padding:10px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}canvas{min-height:320px}}
</style>
</head>
<body>
<main>
<h1>ダンジョン生成テスト</h1>
<p>仕様書の最初の実装確認用です。同じ seed と候補番号なら同じ地形を生成します。通路幅1を基礎に、従来迷路・fBmノイズ・セルオートマトン・ランダムウォーク・BSP・Voronoiと、部屋／こぶの形状加工を組み合わせて確認できます。</p>
<div class="layout">
<section class="panel">
<h2>生成条件</h2>
<div class="controls">
<label class="wide">形状モード<select id="mode"><option value="corridors">通路のみ</option><option value="bulges">通路＋こぶ</option><option value="rooms" selected>小部屋あり</option></select></label>
<label class="wide">通路生成<select id="corridorAlgorithm"><option value="maze" selected>直交迷路</option><option value="bezier_grid">ベジェ誘導4近傍</option></select></label>
<label>ベジェ曲率<input id="corridorCurvature" type="number" value="0.65" min="0" max="1.5" step="0.05"></label>
<label>ベジェ枝数<input id="corridorBranches" type="number" value="7" min="0" max="32" step="1"></label>
<label class="wide">基礎地形アルゴリズム<select id="terrainAlgorithm"><option value="classic" selected>従来方式</option><option value="noise_fbm">Perlin系 fBm + domain warp</option><option value="cellular">セルオートマトン洞窟</option><option value="random_walk">ランダムウォーク洞窟</option><option value="bsp">BSP区画＋部屋</option><option value="voronoi">Voronoi領域</option></select></label>
<label class="wide">部屋・こぶ生成<select id="featureAlgorithm"><option value="primitive" selected>基本図形</option><option value="boolean">ブーリアン合成</option><option value="noise">ノイズ形状</option><option value="cellular">セルオートマトン形状</option><option value="random_walk">ランダムウォーク形状</option><option value="voronoi">Voronoi形状</option></select></label>
<label>seed<input id="seed" type="number" value="20261002" step="1"></label>
<label>候補番号<input id="candidate" type="number" value="0" min="0" step="1"></label>
<label>幅<input id="width" type="number" value="35" min="5" max="50"></label>
<label>高さ<input id="height" type="number" value="29" min="5" max="50"></label>
<label>こぶ 最小<input id="bulgeMin" type="number" value="3" min="1" max="12"></label>
<label>こぶ 最大<input id="bulgeMax" type="number" value="5" min="1" max="12"></label>
<label>こぶ面積 最小<input id="bulgeAreaMin" type="number" value="2" min="1" max="225"></label>
<label>こぶ面積 最大<input id="bulgeAreaMax" type="number" value="8" min="1" max="225"></label>
<label>部屋扱い閾値<input id="promoteArea" type="number" value="12" min="4" max="225"></label>
<label>部屋 最小<input id="roomMin" type="number" value="4" min="1" max="12"></label>
<label>部屋 最大<input id="roomMax" type="number" value="6" min="1" max="12"></label>
<label><span>左右非対称化</span><input id="asymmetry" type="checkbox"></label>
<label>非対称強度<input id="asymmetryStrength" type="number" value="0.7" min="0" max="1" step="0.05"></label>
<label><span>ランダムセル欠損</span><input id="dropout" type="checkbox"></label>
<label>欠損率<input id="dropoutRate" type="number" value="0.08" min="0" max="0.45" step="0.01"></label>
<label><span>ブーリアン反復</span><input id="booleanOps" type="checkbox"></label>
<label>ブーリアン回数<input id="booleanCount" type="number" value="3" min="1" max="12"></label>
<label><span>ノイズ合成</span><input id="noiseBlend" type="checkbox"></label>
<label>ノイズwarp<input id="noiseWarp" type="number" value="1.0" min="0" max="4" step="0.1"></label>
</div>
<div class="buttons"><button id="generate">生成</button><button id="next">次の候補</button><button id="seedNext">seed + 1</button></div>
<p id="status" role="status"></p>
<p class="note">すべて任意です。基本図形に非対称化、セル欠損、union/subtract/xor等の反復ブーリアン、fBmノイズ合成を重ねられます。大きなこぶは指定面積以上で部屋領域へ昇格します。セル・エッジ・宝箱・仕掛け・敵編成は次段階です。</p>
</section>
<section class="panel">
<canvas id="map" width="800" height="620" aria-label="生成されたダンジョン"></canvas>
<div class="legend"><span><i class="swatch" style="background:#d8d6c8"></i>通路</span><span><i class="swatch" style="background:#c6975a"></i>こぶ</span><span><i class="swatch" style="background:#8eb184"></i>小部屋</span><span><i class="swatch" style="background:#8fd3ff"></i>入口</span><span><i class="swatch" style="background:#ffcb73"></i>目的地</span></div>
<div class="stats"><div class="stat">床<b id="floorCount">-</b></div><div class="stat">最長経路<b id="routeSteps">-</b></div><div class="stat">こぶ<b id="bulgeCount">-</b></div><div class="stat">部屋<b id="roomCount">-</b></div></div>
</section>
</div>
<details><summary>生成結果JSON</summary><pre id="json"></pre></details>
</main>
<script type="module">
import {generateDungeonCandidate} from './src/core/dungeon-generator.js';

const $ = id => document.getElementById(id);
const canvas = $('map');
const ctx = canvas.getContext('2d');
let current;

function number(id){ return Number($(id).value); }
function layoutFromForm(){
  const mode = $('mode').value;
  const featureAlgorithm=$('featureAlgorithm').value;
  const shapeOptions={
    asymmetry:{enabled:$('asymmetry').checked,strength:number('asymmetryStrength')},
    dropout:{enabled:$('dropout').checked,rate:number('dropoutRate')},
    booleanOps:{enabled:$('booleanOps').checked,count:number('booleanCount')},
    noiseBlend:{enabled:$('noiseBlend').checked,op:'xor',warp:number('noiseWarp'),octaves:4,scale:.22,threshold:-.08},
    noise:{warp:number('noiseWarp'),octaves:4,scale:.22,threshold:-.08},
    cellular:{fill:.48,steps:4},
    randomWalk:{fill:.48},
    voronoi:{fill:.58,sites:8},
  };
  return {
    mode,
    width:number('width'),
    height:number('height'),
    corridorWidth:1,
    extraLoops:{min:1,max:2},
    corridors:{algorithm:$('corridorAlgorithm').value,branchCount:{min:number('corridorBranches'),max:number('corridorBranches')},curvature:number('corridorCurvature'),sampleDensity:6,turnPenalty:.1},
    terrain:{algorithm:$('terrainAlgorithm').value,options:{noise:{warp:number('noiseWarp'),octaves:5,scale:.16,threshold:-.08,centerBias:.45},cellular:{fill:.47,steps:5},randomWalk:{fill:.42},bsp:{depth:4,minLeaf:6},voronoi:{fill:.58,sites:12}}},
    bulges:{
      count:mode==='bulges'?{min:number('bulgeMin'),max:number('bulgeMax')}:{min:0,max:0},
      positions:['along_corridor','dead_end'],
      shapes:[{id:'side_alcove',weight:2},{id:'end_pocket',weight:1}],
      addedArea:{min:number('bulgeAreaMin'),max:number('bulgeAreaMax')},
      minSpacing:3,
      promoteToRoomArea:number('promoteArea'),
      featureAlgorithm,
      shapeOptions,
    },
    rooms:{
      count:mode==='rooms'?{min:number('roomMin'),max:number('roomMax')}:{min:0,max:0},
      shapes:[
        {id:'rectangle',weight:3},
        {id:'l_shape',weight:2},
        {id:'t_shape',weight:1},
        {id:'cross',weight:1},
        {id:'chamfered',weight:2},
        {id:'roundish',weight:1},
      ],
      width:{min:5,max:11},height:{min:5,max:11},minArea:8,wallThickness:1,mirror:true,entrances:{min:1,max:2},featureAlgorithm,shapeOptions,
    },
  };
}

function draw(candidate){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const cssWidth = Math.max(320, canvas.clientWidth);
  const cssHeight = Math.max(320, Math.round(cssWidth * candidate.height / candidate.width));
  canvas.style.height = `${cssHeight}px`;
  canvas.width = Math.round(cssWidth*dpr);
  canvas.height = Math.round(cssHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
  const cell = Math.min(cssWidth/candidate.width, cssHeight/candidate.height);
  const ox=(cssWidth-cell*candidate.width)/2, oy=(cssHeight-cell*candidate.height)/2;
  ctx.fillStyle='#091015';ctx.fillRect(0,0,cssWidth,cssHeight);
  for(let y=0;y<candidate.height;y++)for(let x=0;x<candidate.width;x++){
    if(candidate.tiles[y][x]!=='#'){
      const type=candidate.regions[y][x];
      ctx.fillStyle=type==='r'?'#8eb184':type==='b'?'#c6975a':'#d8d6c8';
    }else ctx.fillStyle='#26343a';
    ctx.fillRect(ox+x*cell,oy+y*cell,Math.ceil(cell),Math.ceil(cell));
  }
  const marker=(point,color,label)=>{
    ctx.fillStyle=color;ctx.fillRect(ox+point.x*cell,oy+point.y*cell,Math.ceil(cell),Math.ceil(cell));
    if(cell>=10){ctx.fillStyle='#081016';ctx.font=`bold ${Math.max(9,cell*.58)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,ox+(point.x+.5)*cell,oy+(point.y+.52)*cell)}
  };
  marker(candidate.entry,'#8fd3ff','E');marker(candidate.goal,'#ffcb73','G');
}

function render(){
  const status=$('status');
  try{
    current=generateDungeonCandidate({seed:number('seed'),candidateIndex:number('candidate'),layout:layoutFromForm()});
    draw(current);
    $('floorCount').textContent=current.metrics.floorCount;
    $('routeSteps').textContent=current.metrics.routeSteps;
    $('bulgeCount').textContent=current.metrics.bulgeCount;
    $('roomCount').textContent=current.metrics.roomCount;
    $('json').textContent=JSON.stringify(current,null,2);
    status.classList.remove('error');
    status.textContent=`生成成功 / 接続 ${current.validation.reachable}/${current.validation.floorCount} / 地形 ${current.terrainAlgorithm} / 通路 ${current.corridorAlgorithm} / ${current.generatorVersion}`;
  }catch(error){
    status.classList.add('error');status.textContent=error.message;
  }
}

$('generate').addEventListener('click',render);
$('next').addEventListener('click',()=>{$('candidate').value=String(number('candidate')+1);render()});
$('seedNext').addEventListener('click',()=>{$('seed').value=String(number('seed')+1);$('candidate').value='0';render()});
for(const id of ['terrainAlgorithm','corridorAlgorithm','corridorCurvature','corridorBranches','featureAlgorithm','asymmetry','dropout','booleanOps','noiseBlend'])$(id).addEventListener('change',render);
$('mode').addEventListener('change',()=>{
  const mode=$('mode').value;
  if(mode==='corridors'){$('width').value='25';$('height').value='21'}
  if(mode==='bulges'){$('width').value='25';$('height').value='21'}
  if(mode==='rooms'){$('width').value='35';$('height').value='29'}
  render();
});
window.addEventListener('resize',()=>current&&draw(current));
render();
</script>
</body>
</html>
