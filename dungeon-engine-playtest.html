<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランダム生成・実エンジン試遊 — 灯帰りの迷宮</title>
<link rel="stylesheet" href="src/view/style.css">
<link rel="stylesheet" href="src/view/scene-style.css">
<style>
#generator-controls{position:fixed;z-index:200;top:8px;left:8px;max-width:min(720px,calc(100vw - 16px));background:#101a20ee;color:#e0e7e4;border:1px solid #607078;border-radius:8px;padding:8px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px #0008}
#generator-controls summary{cursor:pointer;font-weight:700}
#generator-grid{display:grid;grid-template-columns:repeat(4,minmax(105px,1fr));gap:6px;margin-top:8px}
#generator-grid label{display:grid;gap:2px}#generator-grid input,#generator-grid select,#generator-controls button{font:inherit;color:inherit;background:#22343c;border:1px solid #66777e;border-radius:4px;padding:5px}
#generator-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}#generator-status{max-width:440px}
#app{min-height:100vh}.scene-stage{min-height:100vh}body.embedded #generator-controls{display:none}body.embedded #app,body.embedded .scene-stage{min-height:100vh}
@media(max-width:700px){#generator-grid{grid-template-columns:repeat(2,minmax(110px,1fr))}}
</style>
</head>
<body>
<script>if(window.parent!==window||new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');</script>
<details id="generator-controls" open>
<summary>ランダム生成・実エンジン試遊設定</summary>
<div id="generator-grid">
<label>seed<input id="seed" type="number" value="20261002"></label>
<label>候補<input id="candidate" type="number" min="0" value="0"></label>
<label>形状<select id="mode"><option value="rooms" selected>部屋</option><option value="bulges">こぶ</option><option value="corridors">通路</option></select></label>
<label>通路<select id="corridor"><option value="bezier_grid" selected>ベジェ4近傍</option><option value="maze">迷路</option></select></label>
<label>地形<select id="terrain"><option value="classic" selected>従来</option><option value="noise_fbm">fBm</option><option value="cellular">セルオートマトン</option><option value="random_walk">ランダムウォーク</option><option value="bsp">BSP</option><option value="voronoi">Voronoi</option></select></label>
<label>壁・床素材<select id="sourceDungeon"></select></label>
<label>基本床<select id="baseFloor"></select></label>
<label>基本壁<select id="baseWall"></select></label>
<label>セル1<select id="patch1"></select></label><label>密度1<input id="density1" type="number" min="0" max=".4" step=".01" value=".12"></label>
<label>セル2<select id="patch2"></select></label><label>密度2<input id="density2" type="number" min="0" max=".4" step=".01" value=".08"></label>
<label>セル3<select id="patch3"></select></label><label>密度3<input id="density3" type="number" min="0" max=".4" step=".01" value=".06"></label>
<label>セル4<select id="patch4"></select></label><label>密度4<input id="density4" type="number" min="0" max=".4" step=".01" value=".07"></label>
<label>遭遇<input id="encounters" type="checkbox"></label>
</div>
<div id="generator-actions"><button id="regenerate" type="button">生成してエンジンへロード</button><button id="next" type="button">次の候補</button><span id="generator-status" role="status"></span><a href="dungeon-generation-preview.html">統合確認へ</a></div>
</details>
<div id="app" data-view="scene"></div>
<script type="module" src="src/dungeon-engine-playtest.js"></script>
</body>
</html>
